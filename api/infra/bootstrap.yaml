AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Settle one-time bootstrap: GitHub Actions OIDC deploy role, artifact bucket
  (agent code zips) and ECR repository (API image). Deploy once per account
  with an admin profile; see api/README.md.

Parameters:
  GitHubOrg:
    Type: String
    Default: jannahsherif
  GitHubRepo:
    Type: String
    Default: XRPL-hackathon
  CreateOidcProvider:
    Type: String
    AllowedValues: ["true", "false"]
    Default: "true"
    Description: Set to false if the account already has the token.actions.githubusercontent.com provider.

Conditions:
  CreateProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: CreateProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  ArtifactBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault: { SSEAlgorithm: AES256 }
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      LifecycleConfiguration:
        Rules:
          - Id: expire-old-agent-builds
            Status: Enabled
            Prefix: agent/
            ExpirationInDays: 30

  ApiRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      RepositoryName: settle-api
      ImageScanningConfiguration: { ScanOnPush: true }
      LifecyclePolicy:
        LifecyclePolicyText: |
          {"rules":[{"rulePriority":1,"description":"keep 20 images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":20},"action":{"type":"expire"}}]}

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: settle-github-deploy
      Description: Assumed by GitHub Actions to deploy the Settle backend.
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - CreateProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:aws:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
              # Deploys run only from release-triggered jobs bound to the dev or
              # prod GitHub environment, so only those subjects may assume this role.
              StringLike:
                token.actions.githubusercontent.com:sub:
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:environment:dev
                  - !Sub repo:${GitHubOrg}/${GitHubRepo}:environment:prod
      # PowerUserAccess covers everything except IAM; IAM is granted below,
      # scoped to the settle-* roles the stacks create.
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/PowerUserAccess
      Policies:
        - PolicyName: settle-iam
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ManageSettleRoles
                Effect: Allow
                Action:
                  - iam:CreateRole
                  - iam:DeleteRole
                  - iam:GetRole
                  - iam:UpdateRole
                  - iam:TagRole
                  - iam:UntagRole
                  - iam:PutRolePolicy
                  - iam:GetRolePolicy
                  - iam:DeleteRolePolicy
                  - iam:AttachRolePolicy
                  - iam:DetachRolePolicy
                  - iam:ListRolePolicies
                  - iam:ListAttachedRolePolicies
                  - iam:UpdateAssumeRolePolicy
                  - iam:PassRole
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/settle-*
              - Sid: ServiceLinkedRoles
                Effect: Allow
                Action: iam:CreateServiceLinkedRole
                Resource: "*"
              - Sid: NoSelfEscalation
                Effect: Deny
                Action: ["iam:*"]
                Resource: !Sub arn:aws:iam::${AWS::AccountId}:role/settle-github-deploy

Outputs:
  DeployRoleArn:
    Description: GitHub variable AWS_DEPLOY_ROLE_ARN
    Value: !GetAtt DeployRole.Arn
  ArtifactBucketName:
    Description: GitHub variable ARTIFACT_BUCKET
    Value: !Ref ArtifactBucket
  ApiRepositoryUri:
    Description: ECR repository for the API image
    Value: !GetAtt ApiRepository.RepositoryUri
