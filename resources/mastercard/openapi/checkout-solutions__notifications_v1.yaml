          type: string
          description: Status of the dpa registration request
      type: object
    DpaTransactionOptions:
      properties:
        merchantCategoryCode:
          example: '4444'
          type: string
          description: >-
            Describes the merchant's type of business, product or service. The
            same value is expected in the authorization request
        merchantCountryCode:
          format: ISO 3166 alpha 2
          example: US
          type: string
          description: Country code of the merchant.
        srcTokenRequestData:
          $ref: '#/components/schemas/SrcTokenRequestData'
        transactionAmount:
          $ref: '#/components/schemas/TransactionAmount'
      required:
        - customInputData
      description: Object for Integrator to indicate checkout payload related preferences.
    DynamicData:
      properties:
        dynamicDataType:
          $ref: '#/components/schemas/DynamicDataType'
        dynamicDataValue:
          example: jjoutwsdgfdou124354ljlsdhgout968957
          type: string
          description: Value of the cryptogram corresponding to dynamicDataType.
      required:
        - dynamicDataType
      type: object
    DynamicDataType:
      type: string
      description: >-
        Type of dynamic data required by the integrator to support a checkout
        request. Must be set to CARD_APPLICATION_CRYPTOGRAM_SHORT_FORM.
        CARD_APPLICATION_CRYPTOGRAM_SHORT_FORM is a DSRP cryptogram that is
        base64 encoded and can be up to 32 characters in length. This should be
        included within the Dynamic Payment Data (DE104 SE001) of the
        authorization request to Mastercard.
      example: CARD_APPLICATION_CRYPTOGRAM_SHORT_FORM
      enum:
        - CARD_APPLICATION_CRYPTOGRAM_SHORT_FORM
    EnrollmentRecordNotification:
      properties:
        cardRecords:
          minItems: 1
          items:
            $ref: '#/components/schemas/CardRecord'
          type: array
          description: Object holds for the list of individual Card.
      type: object
      description: >
        A batch enrollmentrecordNotification will be dispatched for each record
        (i.e., PAN or TUR) submitted in a Batch API request.  <br> Successful
        Enrollments will result in a Batch Enrollment Notification containing a
        srcDigitalCardId and associated card metadata, and unsuccessful
        Enrollments will result in a Batch Enrollment Notification containing
        error reason.
    EnrollmentRecordsUpdateNotification:
      properties:
        batchId:
          maxLength: 36
          example: a6016322-ac86-4ac7-8567-e7b8a424c78c
          type: string
          description: >-
            A unique identifier that is generated for the submitted batch sent
            from Mastercard Checkout Solutions part of the 200-acknowledgement
            response. You can use this batchID parameter to check the status of
            the batch process at a later time.
        externalBatchId:
          maxLength: 100
          example: 6ecbf087-f159-4d69-b31d-00bec75c0478
          type: string
          description: >-
            A unique identifier that is passed to Mastercard for each batch API
            request. Please note,  requests will be ignored if an
            externalBatchID is not sent to mastercard
        eventTimeStamp:
          example: '1585741817000'
          type: string
          description: 'Time stamp of the event, UTC time in Unix epoch format'
        enrollmentRecordNotifications:
          minItems: 1
          items:
            $ref: '#/components/schemas/EnrollmentRecordNotification'
          type: array
          description: >
            A batch enrollmentrecordNotification will be dispatched for each record (i.e., PAN or TUR) submitted in a Batch API request. 
            Successful Enrollments will result in a Batch Enrollment Notification containing a srcDigitalCardId and associated card metadata, and unsuccessful enrollments will result in a Batch Enrollment Notification containing error reason.
      type: object
      description: >
        An outbound card enrollment notification that will include the batchID,
        externalBatchID and the enrollment of each record
      example:
        batchId: a6016322-ac86-4ac7-8567-e7b8a424c78c
        externalBatchId: 6ecbf087-f159-4d69-b31d-00bec75c0478
        eventTimeStamp: '1585741817000'
        enrollmentRecordNotifications:
          - cardRecords:
              - enrollmentReferenceType: FPAN
                externalEnrollmentReferenceId: ef016322-ac86-4ac7-8567-e7b8a424c79d
                status: SUCCESS
                maskedCard:
                  dateOfCardCreated: '2020-02-24T11:32:32.060Z'
                  digitalCardData:
                    artUri: >-
                      https://assets.mastercard.com/card-art/combined-image-asset/9d42df54-c5fd-438b-a886-ff0bd1e8f7ec.png
                    descriptorName: Mastercard
                    foregroundColor: '000000'
                    issuerName: Issuing Bank
                    presentationName: null
                    status: ACTIVE
                  panBin: '545503'
                  panExpirationMonth: '04'
                  panExpirationYear: '2023'
                  panLastFour: '6828'
                  paymentAccountReference: 500150F5DE22SND132Y6PR32AR5HB
                  paymentCardDescriptor: Mastercard
                  paymentCardType: CREDIT
                  srcDigitalCardId: 9ajNArkAR66zqYyHCn0rCA000000000000US
    EnrollmentReferenceType:
      type: string
      description: >
        Type of enrollment data an integrator can send to Mastercard Checkout
        Solutions (MCS) for card enrollment.  <br> For integrators looking to
        exchange their MDEs for Merchant (M4M) Token Unique Reference (TUR) for
        a Secure Card on File (SCOF) srcDigitalCardId, the accepted value is
        EXISTING_TOKEN_UNIQUE_REFERENCE <br> For integrators looking to enroll
        their cards using the FPAN, the accepted value is FPAN: A
        variable-length, ISO/IEC 7812-compliant account number.
      example: EXISTING_TOKEN_UNIQUE_REFERENCE
      enum:
        - EXISTING_TOKEN_UNIQUE_REFERENCE
        - FPAN
    Error:
      properties:
        errordetail:
          items:
            $ref: '#/components/schemas/ErrorDetail'
          type: array
          description: List of Errors
        message:
          example: Card type validation message
          type: string
          description: Error message details
        reason:
          example: >-
            The request contains card type, but the card type does not
            correspond with the card number (e.g. card type = Visa; card number
