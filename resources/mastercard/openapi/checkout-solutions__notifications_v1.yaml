          description: Legal name of registered DPA.
        dpaPresentationName:
          maxLength: 60
          example: Mastercard In
          type: string
          description: '"doing business as" name'
        dpaUri:
          maxLength: 1024
          example: www.mastercard.com
          type: string
          description: 'Unique DPA Identifier, such as UUID, URL, APK package name etc.'
      required:
        - dpaName
      type: object
      description: >
        DPA data is DPA related information passed during checkout.


        Conditional: At least one of the 3 fields within DpaData is required if
        you are enrolled in Delegated Authentication, or are using the
        Mastercard Merchant presented QR: SRC program.
    DpaResult:
      properties:
        dpaName:
          example: Mastercard
          type: string
          description: Legal name of registered DPA.
        error:
          $ref: '#/components/schemas/Error'
        srcDpaId:
          example: a4ed9b4c-e9bf-48a4-919f-33558e808569
          type: string
          description: Registered identifier for the merchant (DPA) accessing the service.
        status:
          enum:
            - FAILED
            - SUCCESSFUL
