          items:
            properties:
              message:
                description: Error description
                example: CANNOT_BE_NULL
                type: string
              reason:
                description: Reason for Error.
                enum:
                  - ALREADY_EXISTS
                  - CANNOT_BE_NULL
                  - INVALID_FORMAT
                  - INVALID_STATE
                  - INVALID_VALUE
                example: CANNOT_BE_NULL
