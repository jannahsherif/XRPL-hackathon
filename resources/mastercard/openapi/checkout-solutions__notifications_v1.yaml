          type: string
          description: Explanation of the reason for the error
        status:
          format: int32
          example: '503'
          type: integer
          description: HTTP response status codes.
      required:
        - message
        - reason
        - status
      type: object
      description: >-
        Object of error codes that may be returned along with STATUS, REASON,
        MESSAGE and ERRORDETAIL.
    ErrorDetail:
      properties:
        message:
          example: Card type validation message
          type: string
          description: Error message details
        reason:
          example: >-
            The request contains card type, but the card type does not
            correspond with the card number (e.g. card type = Visa; card number
            = MasterCard)
          type: string
          description: Indicates the reason for the error
        source:
          example: CARD
          type: string
          description: Source of the error
        sourceType:
          $ref: '#/components/schemas/sourceType'
      type: object
    JoseHeader:
      properties:
        alg:
          example: RS256
          type: string
          description: RSA256 algorithm used to sign or encrypt the JWS.
        iat:
          example: '1311280970'
          type: string
          description: >-
            Time in UTC epoc format at which the JWS was generated and issued to
            the requester.
        iss:
          example: 'http://server.example.com'
          type: string
          description: 'The URI of the issuer party, which is Mastercard.'
        jti:
          example: 06128d89fda9a0b037bad91e2b1b17da
          type: string
          description: >-
            Unique identifier Generated by Mastercard for each JWS Payload
            (Mostly a UUID formatted string).
        kid:
          example: 1e9gdk
          type: string
          description: >-
            Mastercard will use Private key to sign the JWS payload, and the KID
            indicates corresponding public key ID which Integrators should refer
            from Mastercard public URL to verify the signature.
      required:
        - alg
        - iat
        - iss
        - jti
        - kid
      type: object
