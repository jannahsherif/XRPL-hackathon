    CardRecord:
      type: object
      properties:
        enrollmentReferenceType:
          $ref: '#/components/schemas/EnrollmentReferenceType'
        externalEnrollmentReferenceId:
          maxLength: 100
          example: ef016322-ac86-4ac7-8567-e7b8a424c79d
          type: string
          description: >-
            A unique identifier that is passed to Mastercard for each PAN/TUR in
            a batch. Please note, the externalenrollmentReferenceID must be
            unique in order to map the correct srcDigitalCardID or errors for a
            given enrollment record.
        status:
          pattern: ^(SUCCESS|FAILED)$
          example: SUCCESS
          type: string
          description: >-
            Enrollment status of an individual enrollmentSource (e.g., PAN or
            TUR) submitted in a Batch request. If enrollmentStatus is 'FAILED',
            view error object for additional information.
        maskedCard:
          $ref: '#/components/schemas/MaskedCardNTU'
        errordetail:
          $ref: '#/components/schemas/ErrorDetail'
    CheckoutPayloadResponse:
      properties:
        jose_header:
          $ref: '#/components/schemas/JoseHeader'
        jws_payload:
          $ref: '#/components/schemas/CheckoutResponse'
        jws_signature:
          example: eyJraWiOiIxNDkwNjQtc3RnLXNyYy1mcGFuLWVuY3J5Ã¢â‚¬Â¦.
          type: string
          description: >-
            The Mastercard Checkout Solutions (MCS) JWS signature that the
            Integrator can use to validate the integrity of the data in the
            checkout response
      required:
        - jose_header
        - jws_payload
        - jws_signature
      type: object
    CheckoutResponse:
      properties:
        acceptanceChannelRelatedData:
          $ref: '#/components/schemas/AcceptanceChannelRelatedData'
        srcDpaId:
          example: a4ed9b4c-e9bf-48a4-919f-33558e808569
          type: string
          description: >
            The registered identifier for the Digital Payment Application (DPA)
            accessing the service.


            Conditional: Required if you are a Merchant directly integrating
            with Mastercard Checkout Solutions (MCS) APIs, a Payment Service
            Provider (PSP) integrating On-Behalf-Of (OBO) a Merchant or if you
            are enrolling in the the SRC QR program.
        dpaData:
          $ref: '#/components/schemas/DpaData'
        dpaTransactionOptions:
          $ref: '#/components/schemas/DpaTransactionOptions'
        eci:
          example: '02'
          maxLength: 2
          type: string
          description: >
            Electronic Commerce Indicator (eci) is a payment system specific
            value that indicates the result of an attempt to authenticate the
            Cardholder.


            This value will only be returned if enabled for the Token
            Authentication Framework (TAF). A value of 02 indicates that the
            transaction is eligible for fraud liability protection. Otherwise,
            the value 06 will be returned.
        encryptedPayload:
          $ref: '#/components/schemas/Payload'
        maskedCard:
          $ref: '#/components/schemas/MaskedCardMakePayment'
        maskedConsumer:
          $ref: '#/components/schemas/MaskedConsumer'
        srcCorrelationId:
          example: 779165e0-1905-4edd-89fa-be46497b5044
          maxLength: 256
          type: string
          description: >
            A unique identifier that correlates a series of two or more requests
            to a single session of activity. Mastercard Checkout Solutions (MCS)
            will return a new srcCorrelationId in each response by default, but
            Integrators may choose to populate previously used srcCorrelationIds
            in subsequent requests to correlate their activity under a single
            ID. This can be done by providing a Mastercard generated
            srcCorrelationId in the request, or by generating your own ID in the
            same format. SrcCorrelationId is used for tracking and
            troubleshooting purposes within Mastercard's ecosystem.
        srciTransactionId:
          example: a5899431-5364-4682-be3d-aba123465a1b
          pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
          type: string
          description: >-
            An optional identifier generated by the Integrator that may be
            passed for internal tracking purposes.
      required:
        - maskedCard
        - srcCorrelationId
      type: object
    ConsumerData:
      properties:
        address:
          example: '1st Some Avenue, The Causeway, NYC, NY 10011'
          type: string
          description: Address of the consumer.
        billNumber:
          example: '543215465132123'
          type: string
          description: >-
            The invoice number or bill number. This number could be provided by
            the merchant or could be an indication for the mobile application to
            prompt the consumer to input a Bill Number. For example, the Bill
            Number may be present when the QR Code is used for bill payment.
        customerLabel:
          example: C128G324
          type: string
          description: >-
            Any value identifying a specific consumer. This value could be
            provided by the merchant (if known), or could be an indication for
            the mobile application to prompt the consumer to input their
            Customer Label. For example, the Customer Label may be a subscriber
            ID for subscription services, a student enrolment number, etc.
        emailId:
          example: sample@mail.com
          type: string
          description: Email address of the consumer.
        loyaltyNumber:
          example: '787888888888888'
          type: string
          description: >-
            Typically, a loyalty card number. This number could be provided by
            the merchant, if known, or could be an indication for the mobile
            application to prompt the consumer to input their Loyalty Number.
        mobileNumber:
          example: '5557778888'
          type: string
          description: >-
            The mobile number could be provided by the merchant or could be an
            indication for the mobile application to prompt the consumer to
            input a Mobile Number. For example, the Mobile Number to be used for
            multiple use cases, such as mobile top-up and bill payment.
        phoneNumber:
          example: 888-213-3432
          type: string
          description: Mobile number of the consumer.
        purposeOftransaction:
          example: b17934db-2580-406b-a798-dab050e38067
          type: string
          description: >-
            Any value identifying a specific consumer. This value could be
            provided by the merchant (if known), or could be an indication for
            the mobile application to prompt the consumer to input their
            Customer Label. For example, the Customer Label may be a subscriber
            ID for subscription services, a student enrolment number, etc.
        referenceLabel:
          example: '77898998646532564456879'
          type: string
          description: >-
            Any value as defined by the merchant or acquirer in order to
            identify the transaction. This value could be provided by the
            merchant or could be an indication for the mobile app to prompt the
            consumer to input a transaction Reference Label. For example, the
            Reference Label may be used by the consumer mobile application for
            transaction logging or receipt display.
        storeLabel:
          example: '54545464654545648775434'
          type: string
          description: >-
            A distinctive value associated to a store. This value could be
            provided by the merchant or could be an indication for the mobile
            application to prompt the consumer to input a Store Label. For
            example, the Store Label may be displayed to the consumer on the
            mobile application identifying a specific store.
        terminalLabel:
          example: 34f4a04b
          type: string
          description: >-
            Populated with a Consumer-entered terminal label if the Terminal
            Label (ID "07"), with a value of "***", is present within the
            Additional Data Field Template (ID "62") of the QR Code Payload.
      type: object
      description: >
        Consumer supplied data, either manually entered (or supplied by other
        means, e.g. voice, camera etc.) or previously stored.
    ConsumerStatus:
      type: string
      description: Signifies the state of the Consumer at any given time at the SRC System.
      enum:
        - ACTIVE
        - LOCKED
        - SUSPENDED
    DelegatedAuthenticationModels:
      properties:
        isSupported:
          example: true
          type: boolean
          description: >-
            Flag indicating whether Token Authentication Framework (TAF) is
            supported for the PAN. TAF enables Cardholder authentication on
            tokenized transactions for Mastercard Checkout Solutions (MCS).
        modelType:
          enum:
            - AE_TYPE_3
            - AE_TYPE_4
          example: AE_TYPE_3
          type: string
          description: >
            Supported Token Authentication Framework (TAF) implementation. TAF
            enables Cardholder authentication on tokenized transactions for
            Mastercard Checkout Solutions (MCS). Mastercard currently offers
            version AE_TYPE_3 and AE_TYPE_4.


            AE_TYPE_3 indicates that the card is eligible for authentication in
            the Acquirer domain without Merchant liability protection.


            AE_TYPE_4 indicates that the card is eligible for authentication in
            the Acquirer domain with Merchant liability protection.
      required:
        - isSupported
        - modelType
      type: object
    DigitalCardDataMakePayment:
      properties:
        artUri:
          example: >-
            https://stage.assets.mastercard.com/card-art/combined-image-asset/MyBank-mastercard.png
          type: string
          description: >-
            URI that digitally represents the physical look of a card. This card
            art image can be used for presentation purposes in user experiences
            and is provided by Issuers.
        coBrandedName:
          maxLength: 128
          example: Very Nice Hotels
          type: string
          description: Name of the company partnering with an Issuer for a co-branded card.
        descriptorName:
          example: mastercard
          maxLength: 64
          type: string
          description: >-
            Issuers name their card portfolios, and they will create both long
            descriptions and short descriptions to market their cards to
            Cardholders. This is the short description for a card.
        isCoBranded:
          example: true
          type: boolean
          description: Indicates whether the card is co-branded.
        presentationName:
          example: My Bank
          type: string
          description: The Issuer name.
        status:
          enum:
            - ACTIVE
            - CANCELLED
            - SUSPENDED
          example: ACTIVE
          type: string
          description: >
            State of the digital card at any given time in the Mastercard
            Checkout Solutions (MCS) system.

              * ACTIVE - Token is active and able to transact.
              * SUSPENDED - Token is suspended by the Issuer and unable to transact.
              * CANCELLED - Token is deleted by the Issuer and unable to transact.
        issuerName:
          minLength: 1
          maxLength: 64
          example: My Bank
          type: string
          description: Name of the issuing bank.
        longDescription:
          minLength: 1
          maxLength: 256
          example: Bank Double Cash Back Rewards Mastercard
          type: string
          description: >-
            Banks name their card portfolios, and they will create both long
            descriptions and short descriptions to market their cards to
            Cardholders. This is the long description for a card.
        foregroundColor:
          minLength: 3
          maxLength: 6
          example: FF5733
          type: string
          description: >-
            Foreground color used to overlay text on top of the card image. This
            is always returned in the product configuration object.
      required:
        - artUri
        - descriptorName
        - status
      type: object
      description: >
        An object that will include the status of the card, whether the card is
        active, suspended or cancelled, the name of the issuer, and card
        descriptors such as the short description of the card used by the
        issuers to name their card portfolio, artURI that digitally represents
        the look of the card, and foreground color.
