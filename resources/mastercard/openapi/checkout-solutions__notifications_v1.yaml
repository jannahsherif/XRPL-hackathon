            - COMPLETED_WITH_ERRORS
            - FAILED
            - IN_PROGRESS
          example: COMPLETED_SUCCESSFULLY
          type: string
          description: describes the status of the batch
        errorMessage:
          example: 'null'
          type: string
          description: >-
            Error message associated with error that occurred when the batch was
            run.
        items:
          items:
            $ref: '#/components/schemas/BatchStatusItems'
          type: array
          description: provides data about batch status items
        requestId:
          example: '1234'
          type: string
          description: request id for the batch
      type: object
    DpaData:
      properties:
        dpaName:
          maxLength: 60
          example: Mastercard
