                type: string
              sourceType:
                $ref: '#/components/schemas/sourceType'
            required:
              - reason
            type: object
          type: array
          description: List of Errors
        message:
          example: >-
            Cannot process the request because it is malformed or has
            incorrect/missing fields or values
          description: Error message details
        reason:
          enum:
            - ALREADY_EXISTS
            - INTERNAL
            - INVALID_ARGUMENT
            - INVALID_STATE
            - PERMISSION_DENIED
            - UNAVAILABLE
          example: INVALID_ARGUMENT
          type: string
          description: Reason for the error.
        status:
          example: 400
          format: int32
          type: integer
          description: HTTP response status codes.
      required:
        - message
        - reason
        - status
      type: object
    BatchStatusItems:
      properties:
        action:
          enum:
            - ADD
            - DELETE
            - UPDATE
          example: ADD
          type: string
          description: The operation for the batch.
        dpaResults:
          items:
            $ref: '#/components/schemas/DpaResult'
          type: array
          description: provides results in an array about dpa data from the batch
        error:
          $ref: '#/components/schemas/Error'
        programName:
          example: SampleProgName_Ce0
          type: string
          description: name of the program
        serviceId:
          maxLength: 255
          example: 'SECURE_COF-SAMPLEPROGNAME_0#01'
          type: string
          description: Identifies a relevant service (program) requested by the Integrator
        trid:
          example: '50132184090'
          minLength: 11
          maxLength: 11
          type: string
          description: >
            Token Requestors receive a unique identifier, TRID, which represents
            the consumer-facing entity name to the Issuer  during the
            tokenization process. This identifier has a one-to-one relationship
            with the serviceId.  <br> <br> Note: Reach out to your Mastercard
            representative to begin receiving trid in API responses.
        status:
          enum:
            - FAILED
            - SUCCESSFUL
          example: SUCCESSFUL
          type: string
          description: Status of the service/program Instance creation
      type: object
    Card:
      properties:
        billingAddress:
          $ref: '#/components/schemas/Address'
        cardholderFirstName:
          example: John
          type: string
          description: Cardholder First Name.
        cardholderFullName:
          example: John Doe
          type: string
          description: Cardholder Full Name.
        cardholderLastName:
          example: Doe
          type: string
          description: Cardholder Last Name.
        cardSecurityCode:
          example: '123'
          format: numeric
          maxLength: 3
          minLength: 3
          type: string
          description: Card security code
        panExpirationMonth:
          example: '10'
          format: numeric
          maxLength: 2
          minLength: 2
          type: string
          description: >-
            Expiration month of the Card, expressed as a two-digit calendar
            month.
        panExpirationYear:
          example: '2022'
          format: numeric
          maxLength: 4
          type: string
          description: >-
            Expiration year of the Card, expressed as a four-digit calendar
            year.
        paymentAccountReference:
          maxLength: 29
          example: 5001EUMYTT3AESCZGUEC77KPCLETI
          type: string
          description: >-
            A non-financial reference assigned to each unique PAN and used to
            link a Payment Account represented by that PAN to affiliated Payment
            Tokens.
        primaryAccountNumber:
          example: '5204731600014784'
          format: numeric
          maxLength: 19
          type: string
          description: >-
            A variable length, ISO/IEC 7812-compliant account number that is
            generated within account ranges associated with a BIN by a Card
            Issuer.
      required:
        - panExpirationMonth
        - panExpirationYear
        - primaryAccountNumber
      type: object
