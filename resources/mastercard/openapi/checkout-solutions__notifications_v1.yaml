          type: string
          description: >-
            Expiration year of the token expressed as four-digit calendar year.
            Supplied when specified for the Payment Token.
        panSequenceNumber:
          minLength: 2
          maxLength: 20
          example: '01'
          type: string
          description: >-
            Application PAN sequence number for the token that can be provided
            in DE 23 of authorization.
      required:
        - paymentToken
      type: object
      description: >-
        Payment token object which include token details such as updated token
        number, updated token expiry etc
    PhoneNumber:
      properties:
        countryCode:
          example: US
          type: string
          description: Address country code. ISO 3166 alpha 2 country code.
        phoneNumber:
          example: 888-222-3333
          type: string
          description: Phone number without country code.
      required:
        - countryCode
        - phoneNumber
      type: object
      description: Phone number.
    SellerData:
      properties:
        qrCodeData:
          example: >-
            000201010211051904151234567890123455204502453038405405100.05802US5913TestMerchant6008New
            York6208030412346304570E
          type: string
          description: QR code data string
      type: object
      description: >
        Seller supplied data supplied over the acceptance channel technology, or
        other means.

        __Conditionality__: At least one of consumerData or sellerData is
        required.
    SrcTokenRequestData:
      properties:
        unpredictableNumber:
          example: fa9e0426
          maxLength: 8
          pattern: '^[0-9a-fA-F]+$'
          type: string
          description: >-
            Optional four-byte binary data that can be randomly generated by the
            merchant or integrator to provide variability and uniqueness to the
            generation of a cryptogram.
      type: object
      description: Object for Integrator to provide an optional unpredictableNumber.
    SrcTokenResultsData:
      properties:
        unpredictableNumber:
          example: fa9e0426
          type: string
          description: >-
            Optional four-byte binary data that can be randomly generated by the
            Integrator and base64 encoded to provide variability and uniqueness
            to the generation of a cryptogram.
      type: object
    Transaction:
      properties:
        amount:
          example: '123.45'
          format: double
          type: number
          description: The amount of the transaction.
        authorizationStatus:
          enum:
            - AUTHORIZED
            - CLEARED
            - DECLINED
            - REVERSED
          example: AUTHORIZED
          type: string
          description: The authorization status of the transaction.
        comboCardAccountType:
          enum:
            - CREDIT
            - DEBIT
          example: CREDIT
          type: string
          description: >-
            Indicator if Credit or Debit was chosen for a tokenized combo card
            at the time of the transaction.
        currencyCode:
          example: '840'
          maxLength: 3
          minLength: 3
          type: string
          description: >-
            Currency in which the transaction amount is expressed. ISO 4217
            three-digit currency code
        installments:
          example: '1'
          maxLength: 3
          type: integer
          description: The number of installments for the transaction.
        issuerResponseInformation:
          enum:
            - DUPLICATE_TRANSMISSION
            - EXPIRED_CARD
            - FORMAT_ERROR
            - INCORRECT_PIN
            - INVALID_CARD_NUMBER
            - MAX_AMOUNT_EXCEEDED
            - PIN_AUTHORIZATION_FAILED
            - PIN_TRIES_NUMBER_EXCEEDED
            - RESTRICTED_CARD
            - TRANSACTION_NOT_PERMITTED
            - WITHDRAWL_AMOUNT_EXCEEDED
            - WITHDRAWL_COUNT_EXCEEDED
          example: FORMAT_ERROR
          maxLength: 32
          type: string
          description: >
            Additional information provided by the issuer for a declined
            transaction.


            Only returned if the transaction is declined and the Program is
            configured to receive this data.
        merchantName:
          example: Bob's Burgers
          maxLength: 64
          type: string
          description: The merchant ("doing business as") name
        merchantPostalCode:
          example: '61000'
          maxLength: 16
          type: string
          description: 'The postal code (for example, zipcode in the U.S.) of the merchant'
        merchantType:
          example: '5812'
          maxLength: 4
          type: string
          description: >-
            The merchant's type of business or service. Must be a valid Merchant
            Category Code (MCC).
        recordId:
          example: '242256508335'
          maxLength: 64
          type: string
          description: Unique identifier for the transaction performed with the card token
        serviceId:
          example: 'SECURE_COF-SAMPLEPROGNAME_0#01'
          type: string
          description: Identifies a relevant service (program) requested by the Integrator
        srcConsumerId:
          example: bf751323-6056-4faa-aeb6-ad1c778a8807
          pattern: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'
          type: string
          description: >-
            Consumer Reference Identifier as generated by Mastercard Checkout
            Services.
        srcDigitalCardId:
          example: 9ajNArkAR66zqYyHCn0rCA000000000000US
          type: string
          description: >-
            A unique identifier that represents the token associated with a card
            enrolled into Mastercard Checkout Solutions (MCS). Use this
            srcDigitalCardId in subsequent checkout requests to retrieve a DSRP
            payload containing the associated token and cryptogram for payment
            authorization. Alternatively, use the srcDigitalCardId in a get card
            request to retrieve the maskedCard details.
        tokenUniqueReference:
          example: DWSPMC000000000fcb2f4136b2f4136a0532d2f4136a0532
          maxLength: 64
          type: string
          description: >-
            A unique reference assigned by Mastercard following the allocation
            of a token. This is used to identify the token for the duration of
            its lifetime
        transactionCountryCode:
          example: USD
          maxLength: 3
          minLength: 3
          type: string
          description: >-
            The country in which the transaction was performed. Expressed as a
            3-letter (alpha-3) country code as defined in ISO 3166-1.
        transactionIdentifier:
          example: 6b86b273ff34fce19d6b804eff5a3f5747ada4eaa22f1d49c01e52ddb7875b4b
          maxLength: 64
          type: string
          description: >-
            A unique identifier for the transaction that is used to match a
            transaction event on the device (for example, a contactless tap, or
            a DSRP payment) to a transaction details record provided by the TDS
        transactionTimestamp:
          example: '1556218800000'
          maxLength: 29
          type: string
          description: >-
            The date/time when the transaction occurred. UTC time in Unix epoch
            format
        transactionType:
          enum:
            - PURCHASE
            - REFUND
          example: PURCHASE
          type: string
          description: >-
            Type of transaction initiated for which the SRC System is being sent
            a request.
      required:
        - authorizationStatus
        - currencyCode
        - recordId
        - transactionTimestamp
        - transactionType
      type: object
    TransactionAmount:
      properties:
        transactionAmount:
          maximum: 1000000000000000000
          minimum: 0
          example: 100.12
          type: number
          description: Numeric value of transaction amount and must be positive.
        transactionCurrencyCode:
          pattern: '^[0-9a-zA-Z]{3,3}$'
          example: USD
          type: string
          description: ISO 4217 three-digit currency code for the transaction.
      required:
        - transactionAmount
        - transactionCurrencyCode
      type: object
      description: >-
        An object for transaction amount details that must be provided for
        Mastercard Merchant Presented QR:SRC program, or if you need to receive
        a v3 cryptogram. A v3 cryptogram is an enhanced cryptogram used for the
        Token Authentication Framework (TAF), which strengthens the security of
        a transaction by linking it to a specific amount and merchant.
    TransactionNotification:
      properties:
        transactions:
          items:
            $ref: '#/components/schemas/Transaction'
