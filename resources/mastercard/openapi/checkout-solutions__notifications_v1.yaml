openapi: 3.0.3
info:
  contact:
    email: apisupport@mastercard.com
    name: API Support
    url: 'https://developer.mastercard.com/support'
  description: >-
    Outbound transaction notifications APIs for Mastercard Checkout Solutions
    (MCS).
  license:
    name: mastercard - confidential
  termsOfService: 'https://developer.mastercard.com/terms-of-use'
  title: Notifications API
  version: 1.0.0
tags:
  - description: >-
     Mastercard Checkout Solutions (MCS) uses outbound API endpoints to deliver event‑driven notifications to the Integrator. 
      These notifications allow MCS to securely push authorization‑related lifecycle updates; such as card activation, suspension, 
      expiration, and cancellation, directly to the Integrators.
      All outbound notifications are over MTLS to ensure strong mutual authentication and a consistent security baseline.
      Customers should treat Mastercard Notifications as informational triggers rather than a guaranteed source of truth. 
      For the latest and most reliable card or token state, customers should always call the getCard API or Checkout API, 
      as notification delivery and order cannot be guaranteed.
    name: Outbound API
servers:
  - description: >-
      Enter the URL of your server here, MA Sandbox Server url provided for
      reference
    url: 'https://sandbox.api.mastercard.com/'
  - description: >-
      Enter the URL of your server here, MA Prod Server url provided for
      reference
    url: 'https://api.mastercard.com/'
paths:
  /notifications/batch/enrollmentrecord:
    post:
      description: >-
        Outbound notifications (per-card) endpoint exposed by client system to
        receive batch enrollment notifications generated by Mastercard Checkout
        Solutions (MCS).
      operationId: postBatchEnrollmentNotification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollmentRecordsUpdateNotification'
        description: outbound card enrollment update notification Request
        required: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
      summary: >-
        Outbound card enrollment update notifications endpoint exposed by client
        system to receive notifications generated by Mastercard Secure Card on
        File
      tags:
        - Outbound API
  /notifications/card:
    post:
      description: >-
        Accepts card status update notifications generated by Mastercard
        Checkout Solutions (MCS).
      operationId: postCardNotification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CardNotification'
            examples:
              UNENCRYPTED CARD UPDATE NOTIFICATIONS:
                $ref: '#/components/examples/UnEncryptedCardNotification'
              PARTIAL ENCRYPTED CARD UPDATE NOTIFICATIONS:
                $ref: '#/components/examples/PartiallyEncryptedCardNotification'
              ENCRYPTED CARD UPDATE NOTIFICATIONS:
                $ref: '#/components/examples/EncryptedCardNotification'
        description: outbound card status update notification Request
        required: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
      summary: >-
        Outbound card status update notifications endpoint exposed by client
        system to receive notifications generated by Mastercard Checkout
        Solutions (MCS).
      parameters:
        - in: header
          name: X-Src-Response-Host
          description: >-
            The X-Src-Response-Host is used to direct all calls from the same
            client to the same server to maintain session affinity. When you
            make your initial API call, Mastercard Checkout Solutions responds
            with the X-Src-Response-Host in the HTTP header. The
            X-Src-Response-Host that is returned will contain a site Specific
            URL that must be used in the subsequent calls to ensure these calls
            are directed to the same server that returned the initial response.
          example: 'https://ksc.services-asn.mastercard.com/'
          schema:
            type: string
            maxLength: 1024
      tags:
        - Outbound API
  /notifications/dpa:
    post:
      description: 'Notify the client the Merchant/DPA add/update results. '
      operationId: notifyJobStatusDpa
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MerchantBatchUpdateNotification'
        description: Outbound Merchant/Dpa add/update batch status notification Request
        required: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
      summary: >-
        Outbound merchant/dpa batch status notifications endpoint exposed by
        client system to receive notifications generated by the Mastercard
        commerce system
      tags:
        - Outbound API
  /notifications/transaction:
    post:
      description: >-
        Accepts transaction notifications generated by Mastercard Checkout
        Solutions (MCS). Token requestors may receive transaction notifications
        generated by Mastercard Checkout Solutions (MCS) on File via **POST
        /notifications/transactions** if the Issuer of the card used to make
        payment supports Transaction Detail Service (TDS).
      operationId: postTransactionNotification
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionNotification'
            examples:
              UNENCRYPTED TRANSACTIONS NOTIFICATIONS:
                $ref: '#/components/examples/UnEncryptedTransactionsNotification'
              ENCRYPTED TRANSACTIONS NOTIFICATIONS:
                $ref: '#/components/examples/EncryptedTransactionsNotification'
        description: Transaction notification Request
        required: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
      security: []
      summary: >-
        Outbound transaction notifications endpoint exposed by client system to
        receive notifications generated by Mastercard Checkout Solutions (MCS).
      tags:
        - Outbound API
  /transaction/credentials:
    post:
      description: Push the Payload to an Integrator.
      operationId: makePayment
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MakePaymentRequest'
        description: Outbound Make Payment Request
        required: true
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
      security: []
      summary: >-
        The Make Payment operation allows an SRC System to send payload
        information for authorization purposes directly to a payment SRCI.
      servers:
        - url: 'https://<make-payment-server-endpoint>:{port}/{basepath}'
          variables:
            basePath:
              default: api
            port:
              default: '443'
      tags:
        - Outbound API
components:
  responses:
    BadRequest:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BadRequestError'
      description: |
        Bad request, see error object for details.
    NoContent:
      description: >
        No content, the service completed successfully and there is no content
        to be returned. If this response code is not given we will attempt a
        single retry.
    NotFound:
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/NotFound'
      description: |
        Not found, see error object for details.
