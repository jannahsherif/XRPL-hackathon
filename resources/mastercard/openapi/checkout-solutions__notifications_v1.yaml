            - ACTIVE
            - CANCELLED
            - SUSPENDED
          example: ACTIVE
          type: string
          description: |
            The status of the digital card at any given time.
            <br>
            ACTIVE - Token is active and able to transact.
            <br>
            SUSPENDED - Token is suspended by the Issuer and unable to transact.
            <br>
