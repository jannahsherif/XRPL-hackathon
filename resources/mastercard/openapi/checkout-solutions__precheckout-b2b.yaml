      nullable: true
      enum:
        - CARD_APPLICATION_CRYPTOGRAM
        - CARDHOLDER_AUTHENTICATION_CRYPTOGRAM
        - CARD_SECURITY_CODE
        - CARD_APPLICATION_CRYPTOGRAM_SHORT_FORM
        - CARD_APPLICATION_CRYPTOGRAM_LONG_FORM
        - DYNAMIC_CARD_SECURITY_CODE
        - NONE

    PaymentOptions:
      type: object
      properties:
        dpaDynamicDataTtlMinutes:
          type: string
          format: numeric
