        payloadRequested:
          $ref: '#/components/schemas/PayloadRequested'
    PayloadRequested:
      type: string
      enum:
        - AUTHENTICATED
        - NON_AUTHENTICATED
      description: Indicates whether the SRCI or Merchant prefers an authenticated or non-authenticated payload.

    DynamicDataType:
