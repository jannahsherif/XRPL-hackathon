        - CVC_COMPLIANCE_VERIFICATION_REQUIRED
        - INVALID_ISSUER
        - INVALID_COUNTRY
        - GUEST_CHECKOUT_NOT_ALLOWED
        - CARD_AUTH_REQUIRED
        - CARD_AUTH_COMPLIANCE_REQUIRED
    ErrorDetailReason:
      type: string
      description: Error reason.
      nullable: true
      enum:
        - CANNOT_BE_NULL
        - INVALID_VALUE
        - INVALID_FORMAT
        - ALREADY_EXISTS
        - INVALID_STATE
        - CORRUPT_DATA
        - EXPIRED
        - EXCESSIVE_ACCOUNTS_PER_CARD
        - EXCESSIVE_ACCOUNTS_PER_PHONE_NUMBER
        - ISS_AUTH_REQUIRED
        - 3DS_REQUIRED
        - 3DS_SCA_FAILED
        - ISS_AUTH_FAILED
        - LOCKED
        - 3DS_VERS_NOT_SUPPORTED
        - 3DS_NOT_PERFORMED
        - 3DS_NOT_SUPPORTED
        - 3DS_NPA_NOT_SUPPORTED
        - 3DS_CHALLENGE_CANCELLED
        - CARD_AUTH_CANCELLED
        - SUSPENDED_CARD
    ErrorSourceType:
      type: string
      description: Source of error.
      nullable: true
      enum:
        - BODY
        - HEADER
        - QUERY
        - PATH

    AuthenticationMethod:
      type: object
      description: The authentication method.
      required:
        - authenticationMethodType
      properties:
        authenticationMethodType:
          $ref: '#/components/schemas/AuthenticationMethodType'
        authenticationSubject:
          $ref: "#/components/schemas/AuthenticationSubject"
        uriData:
          $ref: "#/components/schemas/UriData"
        authenticationCredentialReference:
          type: string
          description: The authentication credential reference.
          example: "ref"
        methodAttributes:
          $ref: "#/components/schemas/MethodAttributes"
        authenticationCredential:
          type: string
          description: The authentication credential.
          example: "otp"

    AuthenticationMethodType:
      type: string
      description: The method used for authentication.
      nullable: true
      enum:
        - SMS_OTP
        - 3DS_NPA
        - 3DSPA
        - MDES_AUTH
        - EMAIL_OTP
        - APP_OTP
        - 3DS
        - CSC_VALIDATION
        - MANAGED_AUTHENTICATION
        - MDES_IDV
        - FIDO2
        - APP_AUTHENTICATION
        - ADDRESS_VERIFICATION
        - SPC

    AuthenticationSubject:
      type: string
      description: The entity performing the authentication.
      enum:
        - CONSUMER
        - CARDHOLDER
        - CARD

    UriData:
      type: object
      description: URI associated with the additional source that the SRC Initiator may use to trigger consent flows.
      properties:
        uri:
          type: string
          maxLength: 2048
          description: The URI part.
          example: "http://uri"
        uriType:
          type: string
          description: The URI type.
          example: "APP_URI"
          enum:
            - APP_URI
            - WEB_URI

    MethodAttributes:
      type: object
      properties:
        cardSecurityCode:
          type: string
          example: '123'
          description: The card security code.
        otpValue:
          type: string
          example: "123"
          description: The OTP value.
        billingAddress:
          $ref: "#/components/schemas/Address"
        threeDsData:
          $ref: "#/components/schemas/ThreeDsData"
        idToken:
          $ref: "#/components/schemas/IdToken"
        supportedManagedAuthMethods:
          type: array
          description: List of supported managed authentication methods.
          items:
            $ref: "#/components/schemas/SupportedManagedAuthMethod"

    SupportedManagedAuthMethod:
      type: string
      nullable: true
      enum:
        - LVLR
    IdToken:
      type: string
      format: JWT
      example: "ihihiyyyygtuyfadsdytwas578qt2e3y2i89qye8qyierhyiqh"

    ThreeDsData:
      type: object

    Address:
      type: object
      properties:
        addressId:
          description: Identifier used to point to the address.
          type: string
          example: "96636f7f-a5f5-4fed-ad43-5baf12511e2a"
          pattern: "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"
        name:
          type: string
          description: Max Length = 60. Name of the individual getting billed for the delivered goods or service.
          maxLength: 60
          example: "name"
        line1:
          type: string
          maxLength: 75
          example: "line 1"
          description: Maximum length is 75. Address line 1. This parameter is required for TAF in Secure Card on File.
        line2:
          type: string
          maxLength: 75
          example: "line 2"
          description: Max Length = 75. Address line 2.
        line3:
          type: string
          maxLength: 75
          example: "line 3"
          description: Max Length = 75. Address line 3.
        city:
          type: string
          maxLength: 50
          example: "city"
          description: Max Length = 50. Address city.
        state:
          type: string
          maxLength: 30
          example: 'New Jersey'
          description: Max Length = 30. Address state.
        countryCode:
          description: "ISO 3166-1 alpha 2 country code. Address country code. Note: This parameter is required for TAF in Secure Card on File"
          type: string
          example: "US"
        zip:
          description: Max Length = 16. Address zip or postal code.
          type: string
          maxLength: 16
          example: "12345"
        createTime:
          description: Date and time the address was created. UTC time in Unix epoch format.
          type: string
          format: numeric
          example: "1678886400"
        lastUsedTime:
          description: Date and time the address was last used. UTC time in Unix epoch format.
          type: string
          format: numeric
          example: "1678886400"

    JSONObject:
      type: object
      description: A generic object to pass custom JSON object.
      example: { "com.mastercard.dcfExperience": "WITHIN_CHECKOUT" }

    srcClientId:
      type: string
      maxLength: 255
      description: |
        A unique identifier assigned by Mastercard during onboarding which signifies the responsible party Integrating to Mastercard Checkout Solutions (MCS).
        pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      example: '6aff5cba-3aac-4fe0-b0cd-a52fc948d0c6'
    srcDpaId:
      type: string
      maxLength: 255
      description: The registered identifier for the Digital Payment Application (DPA) accessing the service.
      example: '297b379a-663c-4e31-a019-b3a48701b8ae'
    serviceId:
      type: string
      maxLength: 255
      description: Unique identifier assigned by Mastercard to create tokens for the onboarded entity.
      default: "SRC"
      example: 'SRC'
    srciTransactionId:
      type: string
      maxLength: 255
      description: Identifier used to audit this request.
      example: '123'
    srcCorrelationId:
      type: string
      maxLength: 256
      description: |
        A unique identifier that correlates two or more requests to a single session.
        Mastercard Checkout Solutions (MCS) returns a new srcCorrelationId in each response by default.
        Integrators can provide a previously used srcCorrelationId in subsequent requests to correlate
        activity under a single ID. Integrators can also generate an ID in the same format.
        srcCorrelationId is used for tracking and troubleshooting in the Mastercard ecosystem.
        pattern: ^([0-9a-f]{8}.)?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      example: '6aff5cba-3aac-4fe0-b0cd-a52fc948d0c6'
    CrossEnrollmentData:
      type: object
      required:
        - srcClientId
        - srcCorrelationId
        - destinationRequestorReference
        - referenceData
      properties:
        srcClientId:
          $ref: "#/components/schemas/srcClientId"
        srcCorrelationId:
          $ref: "#/components/schemas/srcCorrelationId"
        destinationRequestorReference:
          type: object
          description: |
            TRID grouping or destination service ID for the merchant or integrator requesting enrollment data.
                Enum:
                  Type: [ TRID, SERVICE_ID ]. The TRID or service ID is shared manually during onboarding.
                Value: Value of TRID, SERVICE_ID
          properties:
            type:
              type: string
              description: "The type of destination reference either TRID or SERVICE_ID"
              example: TRID
              enum:
                - TRID
                - SERVICE_ID
            value:
              type: string
              example: 50123456789
              description: Destination TRID or destination service ID.
          example:
            value:
              type: TRID
              value: 50123456789
        serviceId:
          $ref: "#/components/schemas/serviceId"
        referenceData:
          $ref: "#/components/schemas/EnrolmentReferenceData"

    CrossEnrollmentDataResult:
      type: object
      properties:
        srcCorrelationId:
          $ref: "#/components/schemas/srcCorrelationId"
        enrolmentReferenceData:
          $ref: "#/components/schemas/EnrolmentReferenceData"
        encryptedBillingAddress:
          type: string
          example: "d9385462d3deff78c352ebb3f941ce12"
          description: >
            The billing address for the card whose enrollment data is being created or requested. The billing address is in the Address schema format.

    EnrolmentReferenceData:
      type: object
      description: |
        Retrieves the payment reference for a successful enrollment in the destination service ID or TRID.
      required:
        - enrolmentReferenceId
        - enrolmentReferenceType
      properties:
        enrolmentReferenceId:
          type: string
          example: 7b3de30a-b15e-4578-ab88-ffa41d9119bc
          description: >
            This value corresponds to the selected enrolmentReferenceType.
            Provide the value for the selected enrolmentReferenceType in this request parameter.
            The response returns the value of enrolmentReferenceType.
        enrolmentReferenceType:
          $ref: '#/components/schemas/EnrolmentReferenceType'
        authorization:
          description: |
            Conditional: Integrators that support Click to Pay (C2P) through Mastercard Checkout Solutions (MCS)
            can let consumers save their card on file after guest checkout. Provide the C2P transaction
            authorization token in the authorization parameter.
            This parameter is required when enrolmentReferenceType is SRC_DIGITAL_CARD_ID.
          example: "eyJraWQiOiIyMDIzMDEyNjExNDM0NS1zdGctbWMtbmV3LWlkZW50aXR5LXZlcmlmaWNhdGlvbi1zcmMtbWFzdGVyY2FyZC1pbnQiLCJ0eXAiOiJKV1QrZXh0LmNwZWNfdG9rZW4iLCJhbGciOiJSUzI1NiJ9..ZLq61Ct1-FgOMnDe06E2NhabCrJYqcTSRvBINE9uw3II48KNCAgWWCotW_tmOlSDM6Y-jdF9zTn9K5i3tMyaortQm4ACpyq9AF9g4LZ4rG3mfR_XNQN5SsfRuduZEOhIo2Tj2GaCaFc2cy0SZckWS2WRa0gDcClVjttpTv0pKQJ6GBxKnGdZcSX8vxeWltikRAiT8rPIDYx2E1K9SkErmWod71o2eGl8nxjDFHtmXIIAPr6GGq8PQZQfnxrNAUF2u002okBKCL__VQEBw1V29Kig0waQzeUoxqxTYvC7l7NYdrN9z4nKcnB70BANEcfSsnnrch2PocjU1xM3LiejdA"
          type: string

    EnrolmentReferenceType:
      description: |
        Type of enrollment reference data passed to Mastercard for enrollment.
        The enrolmentReferenceType determines the value required for the enrollment reference ID.
        Accepted value is:
            SRC_DIGITAL_CARD_ID - Reference to the srcDigitalCardId. Identifies the card to be used for checkout.
            This is used to cross enroll Click to Pay (C2P) guest checkout credentials into card on file.
            The value of the srcDigitalCardId must be provided in the enrolmentReferenceId parameter
        Response:
            SRC_DIGITAL_CARD_ID - Reference to the srcDigitalCardId. Identifies the card to be used for checkout.
            This is used to cross enroll Click to Pay (C2P) guest checkout credentials into card on file.
            The value of the srcDigitalCardId must be provided in the enrolmentReferenceId parameter.
      type: string
      example: SRC_DIGITAL_CARD_ID
      enum:
        - SRC_DIGITAL_CARD_ID