      nullable: true
      enum:
        - SUMMARY
        - FULL
        - PAYMENT
        - NON_PAYMENT

    TransactionAmount:
      type: object
      description: Transaction amount given in the format corresponding to the ISO 4217 currency code specified by transactionCurrencyCode.
      required:
        - transactionAmount
      properties:
        transactionAmount:
          type: number
          format: float
          example: 10.0
          description: The transaction amount.
        transactionCurrencyCode:
          type: string
          example: "USD"
          description: The transaction currency code.

    MaskedConsumer:
      type: object
      description: Authenticated user
      required:
        - srcConsumerId
        - dateConsumerAdded
      properties:
        srcConsumerId:
          type: string
          example: "7dc8ccfe-5838-445b-9944-24fbeb222838"
          description: SRC Consumer Reference Identifier as generated by the Click to Pay System.
        maskedConsumerIdentity:
          $ref: '#/components/schemas/MaskedConsumerIdentity'
        maskedEmailAddress:
          type: string
          maxLength: 255
          example: "t*****0@mailinator.com"
          description: Max Length = 255. Masked Consumer email address.
        maskedConsumerMobileNumber:
          $ref: '#/components/schemas/MaskedPhoneNumber'
        maskedNationalIdentifier:
          type: string
          maxLength: 20
          example: "5********"
          description: Max Length = 20 Masked Consumer national identifier.
        complianceSettings:
          $ref: '#/components/schemas/ComplianceSettings'
        countryCode:
          type: string
          example: "US"
          description: ISO 3166 alpha-2 country code. Consumer-provided country code.
        languageCode:
          type: string
          example: "en"
          description: ISO 639-1 Code. Consumer provided language choice.
        status:
          type: string
          example: "ACTIVE"
          description:  |
            Signifies the state of the consumer at any given time at the Click to Pay System.
              Values: ACTIVE, SUSPENDED,LOCKED
        maskedFirstName:
          type: string
          example: "t***"
          description: Max Length = 30. Masked first name of the consumer.
        maskedLastName:
          type: string
          example: "t***"
          description: Max Length = 30. Masked last name of the consumer.
        dateConsumerAdded:
          type: string
          example: "2019-05-09T18:50:49.432Z"
          description: UTC timestamp when consumer was added to the Click to Pay System.

    MaskedPhoneNumber:
      type: object
      description: Masked Consumer mobile phone number.
      required:
        - countryCode
        - phoneNumber
      properties:
        countryCode:
          type: string
          minLength: 1
          maxLength: 4
          example: "1"
          description: Length = 1 to 4 digits. Phone number country code. International calling code format.
        phoneNumber:
          type: string
          minLength: 4
          maxLength: 14
          example: "(***) ***-*946"
          description: Length = 4 to 14 digits. Phone number without country code.



    IdentityProvider:
      type: string
      description: Entity or organization that collected and verified the Consumer Identity.
      nullable: true
      enum:
        - SRC

    IdentityType:
      type: string
      description: >
        Specifies the type of consumer identity transmitted or collected. Allowed values are EMAIL_ADDRESS or MOBILE_PHONE_NUMBER.
                    A MOBILE_PHONE_NUMBER must include the country code followed by the phone number. Digits only (no spaces, hyphens, or special characters).
                    Do not include the plus (+) symbol.
      nullable: true
      example: MOBILE_PHONE_NUMBER
      enum:
        - EMAIL_ADDRESS
        - MOBILE_PHONE_NUMBER

    ConsumerIdentity:
      type: object
      description: >
        Primary verifiable consumer identifier within a Click to Pay Profile. It can be email address or mobile phone number.
        Required if idLookupSessionId is not provided.
      required:
        - identityType
        - identityValue
      properties:
        identityProvider:
          $ref: '#/components/schemas/IdentityProvider'
        identityType:
          $ref: '#/components/schemas/IdentityType'
        identityValue:
          type: string
          example: "18686468661"
          description: Consumer Identity value that corresponds to the Consumer Identity Type. Is used to locate information within the Click to Pay Profile.

    MaskedConsumerIdentity:
      type: object
      required:
        - identityType
        - maskedIdentityValue
      properties:
        identityProvider:
          $ref: '#/components/schemas/IdentityProvider'
        identityType:
          $ref: '#/components/schemas/IdentityType'
        maskedIdentityValue:
          type: string
          example: "123456"
          maxLength: 255
          description: Max Length = 255. Masked consumer identifier value, e.g., masked email address or masked mobile phone number as per masking rules.

    ComplianceSettings:
      type: object
      description: Consumer compliance settings.
      properties:
        complianceResources:
          type: array
          items:
            $ref: "#/components/schemas/ComplianceResource"

    ComplianceResource:
      type: object
      description: "A set of compliance resource objects for indicating the consumer’s consent."
      properties:
        complianceType:
          type: string
          example: REMEMBER_ME
          description: |
            An enumeration with various possible values. Some suggested values are
            PRIVACY_POLICY, REMEMBER_ME,TERMS_AND_CONDITIONS, COOKIE GEOLOCATION
        uri:
          type: string
          example: "https://www.mastercard.com/global/click-to-pay/country-listing/terms.html"
          description: "Max Length = 1024. Represents the URI where the consumer consent is captured."
        version:
          type: string
          example: "1.0"
          description: "Max Length = 10. Version details of the device/browser that captured the consent."
        datePublished:
          type: string
          example: "1679318465"
          description: "UTC time in Unix epoch format. Represents when the resource was published."

