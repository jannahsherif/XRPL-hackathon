openapi: 3.0.3
info:
  title: Mastercard Cards Batch Enroll API
  description: Integrators can create unique tokens with Mastercard by enrolling credentials in a batch via Batch Enroll API. After a credential is enrolled, Integrators can use the srcDigitalCardId to understand the latest digital data regarding their tokenized credential.
  termsOfService: https://developer.mastercard.com/terms-of-use
  contact:
    name: API Support
    email: apisupport@mastercard.com
    url: https://developer.mastercard.com/support
  license:
    name: Apache 2.0
    url: http://www.apache.org/licenses/LICENSE-2.0.html
  version: 1.0.0
tags:
  - name: Batch Cards
    description: Tokenize your cards asynchronously in a batch. After the batch is processed, retrieve the srcDigitalCardId and srcConsumerId for individual cards and cardholders in the batch respectively.
servers:
  - description: Sandbox server
    url: https://sandbox.api.mastercard.com/src/api/digital/payments
  - description: Production Server
    url: https://api.mastercard.com/src/api/digital/payments
paths:
  /cards/batch:
    post:
      summary: Batch Cards enrollment
      description: |
        The Batch API enrolls Mastercard cards into Mastercard and provisions tokens
        which may be used in future transactions.
      operationId: tokenizeCardsInBatch
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BatchRequest'
            examples:
              SCOF_BATCH_ENROLL_REQUEST - JWEEncryptedRequest:
                $ref: '#/components/examples/EncryptedSCOFEnrollCardBatchRequest'
              SCOF_BATCH_ENROLL_REQUEST_TUR - PlainTextRequest:
                $ref: '#/components/examples/PlainTextSCOFTUREnrollCardBatchRequest'
        required: true
      responses:
        "202":
          description: |
            Accepted, Batch Id included in the response body
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchResponse'
        "400":
          description: |
            Bad request. Reason code of `INVALID_ARGUMENT` Identifies a malformed or invalid request. Use cases:
              * Request Body JSON does not confirm to the schema of BatchRequest
              * Mandatory parameters in request are missing example `externalBatchId` or `srcClientId` or `serviceId`
                values are not provided.
              * Request parameters value has invalid format example, `srcClientId` is not in UUID format.

            Reason code of `INVALID_STATE` identifies a validation failed on request. Use cases:
              * Request Body JSON schema validation failure.
              * Data Type validation failure.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID_ARGUMENT:
                  description: |
                    See the message content for extra information. Either:

                      * null externalBatchId
                      * null srcClientId
                      * null serviceId
                  value:
                    status: 400
                    reason: INVALID_ARGUMENT
                    message: Cannot process the request because it is malformed or has incorrect/missing fields or values.
                    errordetail:
                      - reason: CANNOT_BE_NULL
                        source: serviceId
                        message: serviceId is required
                        sourceType: BODY
      tags:
        - Batch Cards
  /cards/batch/{batchId}:
    get:
      summary: Get Batch Status by Batch ID
      description: |
        The Get Batch Status by Batch ID operation will retrieve the complete batch process details like status,
        total no. of records inside the batch, no. of records processed & additionally provide the individual record
        enroll status with externalConsumerId, externalCardId and srcDigitalCardId & srcConsumerId if enrollment
        successful.
      operationId: getBatchStatus
      responses:
        "200":
          description: |
            OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BatchStatusResponse'
              examples:
                SCOF_BATCH_STATUS - COMPLETED_SUCCESSFULLY:
                  $ref: '#/components/examples/BatchSCOFEnrollSuccessfulCompletionStatusResponse'
                SCOF_BATCH_STATUS - COMPLETED_WITH_FAILURES:
                  $ref: '#/components/examples/BatchSCOFEnrollCompletionWithErrorsStatusResponse'
                SCOF_BATCH_STATUS - PROCESSING:
                  $ref: '#/components/examples/BatchSCOFEnrollProcessingStatusResponse'
                SCOF_BATCH_STATUS - SUBMITTED:
                  $ref: '#/components/examples/BatchSCOFEnrollSubmittedStatusResponse'
                SCOF_BATCH_STATUS - FAILED:
                  $ref: '#/components/examples/BatchSCOFEnrollFailedStatusResponse'
        "400":
          description: |
            Bad request. Invalid batch Id field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                INVALID_ARGUMENT:
                  value:
                    status: 400
                    reason: INVALID_ARGUMENT
                    message: Cannot process the request because it is malformed or has incorrect/missing fields or values.
                    errordetail:
                      - reason: CANNOT_BE_NULL
                        source: batchId
                        message: batchId cannot be null
                        sourceType: PATH
        "404":
          content:
            application/json:
              example:
                errordetail:
                  - message: BatchId not found
                    reason: NOT_FOUND
                    source: batchId
                    sourceType: PATH
                message: Cannot process the request because it is malformed or has incorrect/missing fields or values.
                reason: NOT_FOUND
                status: 404
              schema:
                $ref: '#/components/schemas/Error'
          description: |
            batchId not found in the MACS system.
      parameters:
        - in: path
          name: batchId
          description: |
            The batchId of the batch cards  enrolled in Mastercard.
          example: ecbf78ec-0e8b-414f-8cfc-63e9c3fb9d48
          required: true
          schema:
            type: string
        - in: query
          name: srcCorrelationId
          description: |
            A unique identifier that correlates a series of two or more requests to a single session of activity.
            Mastercard will return a new srcCorrelationId in each response by default, but
            Integrators may choose to populate previously used srcCorrelationIds in subsequent requests to correlate
            their activity under a single ID. This can be done by providing a Mastercard generated srcCorrelationId in
            the request, or by generating your own ID in the same format. SrcCorrelationId is used for tracking and
            troubleshooting purposes within Mastercard's ecosystem.
          required: false
          example: aec165e0-1905-4edd-89fa-be46497b5044
          schema:
            $ref: '#/components/schemas/SrcCorrelationId'
        - in: query
          name: srcClientId
          description: |
            A unique identifier assigned by Mastercard during onboarding which signifies the responsible party
            Integrating to Mastercard.
          example: eccbf087-f159-4d69-b31d-00bec75c0474
          required: true
          schema:
            $ref: '#/components/schemas/SrcClientId'
        - in: query
          name: serviceId
          description: |
            A unique identifier assigned by Mastercard for which tokens are created uniquely for the entity onboarded.
          example: SRC_C2P#CBA#01
          required: true
          schema:
            $ref: '#/components/schemas/ServiceId'
      tags:
        - Batch Cards
