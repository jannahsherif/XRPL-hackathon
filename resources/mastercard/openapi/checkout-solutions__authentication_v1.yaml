openapi: "3.0.0"
info:
  description: "SRC Authentication Orchestrator provides the public endpoint to perform Cardholder authentications via SRC rails. It exposes endpoints that through B2B as well as B2C Channel."
  version: "1.0.0"
  title: "Authentication Orchestrator API"
  termsOfService: "https://developer.mastercard.com/terms-of-use"
  contact:
    name: "API Support"
    email: "apisupport@mastercard.com"
    url: "https://developer.mastercard.com/support"
  license:
    name: "Apache 2.0"
    url: "http://www.apache.org/licenses/LICENSE-2.0.html"
servers:
  - url: "https://sandbox.api.mastercard.com/"
    description: "Sandbox Server."
  - url: "https://api.mastercard.com/"
    description: "Production server."
tags:
  - name: Authentication
    description: >-
      API definitions for Mastercard Secure Card on File Authentication API Endpoints. 
      The Lookup endpoint retrieves available authentication methods and multi-factor authenticators available for the requested card and customer. 
      The Authenticate endpoint authenticates a transaction or validate a proof of authentication from an earlier transaction. 
      The Bind API links a card to the provided multi-factor authenticator.
paths:
  /digital/accountholder/authentications/lookup:
    post:
      summary: "Lookup supported authentication methods for a given card ID."
      tags:
        - Authentication
      description: "Retrieves the authentication methods and authenticators supported for a given card. Returns a URI to provide URL based authentication invocation."
      operationId: "lookupAccountHolderAuthenticationProfile"
      parameters:
        - $ref: "#/components/parameters/xSrcCxFlowId"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/B2BLookupRequestAuthentication"
            examples:
              "Single Authentication Reason":
                $ref: "#/components/examples/B2BLookupRequestSingleAuthReason"
              "Multiple Authentication Reasons":
                $ref: "#/components/examples/B2BLookupRequestMultiAuthReasons"
        required: true
      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/B2BLookupResponseAuthentication"
              examples:
                EXAMPLE - Risk Based Issuer Authentication Eligible:
                  $ref: "#/components/examples/B2BLookupResponseIssuerRba"
                EXAMPLE - Managed Authentication Eligible:
                  $ref: "#/components/examples/B2BLookupResponseManagedAuth"
                EXAMPLE - OnBehalf Issuer Authentication Eligible:
                  $ref: "#/components/examples/B2BLookupResponseOnBehalf"
                EXAMPLE - MA Passkey Tentatively Found:
                  $ref: "#/components/examples/B2BLookupResponsePasskeyTentative"
                EXAMPLE - MA Passkey Pending Verification:
                  $ref: "#/components/examples/B2BLookupResponsePasskeyPendingVerification"
          headers:
            X-SRC-CX-FLOW-ID:
              $ref: "#/components/headers/X-SRC-CX-FLOW-ID"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"
  /digital/accountholder/authentications/authenticators:
    post:
      summary: "Bind MFA to card or consumer identifier"
      tags:
        - Authentication
      description: "Provide a client with the means to bind a MFA method to a FPAN/srcDigitalCardId and/or consumer Identifier, e.g, email address, mobile number etc."
      operationId: "bindMfaMethod"
      parameters:
        - $ref: "#/components/parameters/xSrcCxFlowId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BindMfaRequestMethod"
            examples:
              EXAMPLE - 3P FIDO MFA with IAAV/TAV Binding:
                $ref: '#/components/examples/B2BBindRequestTAVBindSTF'
              EXAMPLE - 3P FIDO MFA with MA 3DS Binding:
                $ref: '#/components/examples/B2BBindRequest3PFIDOBindSPK'
              EXAMPLE - 3P PKI MFA with Issuer OTP Binding:
                $ref: "#/components/examples/B2BBindRequest3PPropIssuerOtp"
              EXAMPLE - 3P PKI MFA with external 3DS Binding:
                $ref: '#/components/examples/B2BBindRequest3PPKI'
              EXAMPLE - MA Passkey with MDES ID&V:
                $ref: '#/components/examples/B2BBindRequestMultiAuthIdv'

      responses:
        '200':
          description: "OK"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BindMfaResponseMethod"
              examples:
                EXAMPLE:
                  $ref: "#/components/examples/B2BBindResponse"
          headers:
            X-SRC-CX-FLOW-ID:
              $ref: "#/components/headers/X-SRC-CX-FLOW-ID"
        '400':
          $ref: "#/components/responses/BadRequestAuthenticators"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"
    delete:
      summary: "Delete MFA Method Instance by MFA Method Instance Id"
      tags:
        - Authentication
      description: "The Delete MFA method instance operation will delete the MFA method instance corresponding the specified MFA Method Instance Id."
      operationId: "deleteMfaMethodInstance"
      parameters:
        - $ref: "#/components/parameters/xSrcCxFlowId"
        - $ref: "#/components/parameters/srcClientIdRequired"
        - in: query
          name: serviceId
          schema:
            type: string
          required: true
          description: "Identifies a relevant / requested service (program). This ID is assigned by Mastercard. Conditional – required for Exeternal FIDO2 MFA."
          example: "SRC"
        - in: query
          name: certifiedMfaMethodId
          deprecated: true
          schema:
            type: string
          required: true
          description: "Unique identifier identifying the certified MFA method. Registered after the successful certification of the MFA Method."
          example: "43SA5"
        - in: query
          name: certifiedSolutionId
          schema:
            type: string
          required: true
          description: "Unique identifier identifying the certified MFA method. Registered after the successful certification of the MFA Method."
          example: "43SA5"
        - in: query
          name: externalMfaMethodInstanceId
          schema:
            type: "string"
          required: false
          deprecated: true
          description: "Client supplied unique identifier identifying the MFA Method Instance. Conditional – required if mfaMethodInstanceId not present."
          example: "51a977f3-bda4-498b-901d-b48ad4d97abv"
        - in: query
          name: externalCredentialId
          schema:
            type: string
          description: "Client supplied unique identifier identifying the Authentication Credential Instance. Conditional – required if credentialId not present."
          example: 39479fd5-53b0-4802-bb13-91518c9f9e35
        - in: query
          name: mfaMethodInstanceId
          schema:
            type: "string"
          deprecated: true
          description: "Mastercard generated unique identifier identifying the MFA Method Instance. Conditional – required if externalMfaMethodInstanceId not present."
          example: "51a977f3-bda4-498b-901d-b48ad4d97abv"
        - in: query
          name: credentialId
          schema:
            type: string
          description: "Mastercard generated unique identifier identifying the Authentication Credential Instance. Conditional – required if externalCredentialId not present."
          example: e74b92cb-3e21-4f9d-8a10-5400b41974e1
        - in: query
          name: resourceType
          schema:
            type: string
          description: Authentication resource type.
          example: "CARD"
        - in: query
          name: resourceId
          schema:
            type: string
          description: "Unique Identifier of the Card. Reference representing the PAN or Payment Token that enables a non-SRCPI entity to identify the underlying PAN. A single PAN can have one or more SRC Digital Card Reference Identifiers. Digital Card information can be accompanied with SRC Digital Card Reference Identifier. It is associated with the SRC Profile to which the Digital Card belongs and is unique within an SRC System."
          example: "51a977f3-bda4-498b-901d-b48ad4d97abv"
      responses:
        '200':
          description: "OK"
          headers:
            X-SRC-CX-FLOW-ID:
              $ref: "#/components/headers/X-SRC-CX-FLOW-ID"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UnbindMfaResponseMethod"
        '400':
          $ref: "#/components/responses/BadRequest"
        '401':
          $ref: "#/components/responses/Unauthorized"
        '403':
          $ref: "#/components/responses/Forbidden"
        '404':
          $ref: "#/components/responses/NotFound"

  /digital/accountholder/authentications/authenticate:
    post:
      summary: Provides the capability to authenticate a principal using the supported authentication methods.
      description: >-
        Provide a client with the means to initiate an B2B authentication based on the specified input criteria. On success, the service returns an authentication ID which can be used to correlate and track subsequent interactions with the Consent Service regarding this authentication.
      operationId: AccountHolderAuthenticationsAuthenticateProfile
      tags:
        - Authentication
      parameters:
        - $ref: '#/components/parameters/xSrcCxFlowId'
        - $ref: '#/components/parameters/srcCorrelationIdHeaderOptional'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestAuthenticate'
            examples:
              EXAMPLE - MDES IDV Initiate:
                $ref: '#/components/examples/B2BAuthenticateInitRequestIAO'
              EXAMPLE - MDES IDV Complete:
                $ref: '#/components/examples/B2BAuthenticateCompRequestIAO'
              EXAMPLE - 3P FIDO Assertion Validation:
                $ref: '#/components/examples/B2BAuthenticateRequest3PFIDOValidationSPK'
              EXAMPLE - IAAV/TxAV Validation:
                $ref: '#/components/examples/B2BAuthenticateRequestTxAVSTF'
              EXAMPLE - 3P PKI Assertion Validation:
                $ref: '#/components/examples/B2BAuthenticateRequest3PPKI'
              EXAMPLE - APP_AUTHENTICATION Initiate:
                $ref: '#/components/examples/B2BAuthenticateRequestAppAuthenticationInitiate'
              EXAMPLE - MANAGED_AUTHENTICATION Initiate:
                $ref: '#/components/examples/B2BManagedAuthenticationRequestInitiate'
              EXAMPLE - APP_AUTHENTICATION Complete:
                $ref: '#/components/examples/B2BAuthenticateRequestAppAuthenticationComplete'
              EXAMPLE - APP_PUSH_NOTIFICATION Initiate:
                $ref: '#/components/examples/B2BAuthenticateRequestPushNotificationInitiate'
              EXAMPLE - APP_PUSH_NOTIFICATION Complete:
                $ref: '#/components/examples/B2BAuthenticateRequestPushNotificationComplete'
              EXAMPLE - ISSUER_RBA Initiate and Complete:
                $ref: '#/components/examples/B2BAuthenticateRequestIssuerRba'
              EXAMPLE - FIDO2 Initiate:
                $ref: '#/components/examples/B2BAuthenticateRequestFidoInitiate'
              EXAMPLE - FIDO2 Complete:
                $ref: '#/components/examples/B2BAuthenticateRequestFidoComplete'
              EXAMPLE - MANAGED_AUTHENTICATION Complete:
                $ref: '#/components/examples/B2BManagedAuthenticationRequestComplete'

        description: Authenticate API Request
        required: true
      responses:
        '200':
          description: >-
            OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponseAuthenticate'
              examples:
                EXAMPLE - MDES IDV Initiate:
                  $ref: '#/components/examples/B2BAuthenticateInitResponseIAO'
                EXAMPLE - MDES IDV Complete:
                  $ref: '#/components/examples/B2BAuthenticateCompResponseIAO'
                EXAMPLE - 3P FIDO Assertion Validation:
                  $ref: '#/components/examples/B2BAuthenticateResponse3PFIDOValidationSPK'
                EXAMPLE - IAAV/TxAV Validation:
                  $ref: '#/components/examples/B2BAuthenticateResponseTxAVSTF'
                EXAMPLE - 3P PKI Assertion Validation:
                  $ref: '#/components/examples/B2BAuthenticateResponse3PPKI'
                EXAMPLE - APP_AUTHENTICATION Initiate:
                  $ref: '#/components/examples/B2BAuthenticateResponseAppAuthenticationInitiate'
                EXAMPLE - APP_AUTHENTICATION Complete:
                  $ref: '#/components/examples/B2BAuthenticateResponseAppAuthenticationComplete'
                EXAMPLE - APP_PUSH_NOTIFICATION Initiate:
                  $ref: '#/components/examples/B2BAuthenticateResponsePushNotificationInitiate'
                EXAMPLE - APP_PUSH_NOTIFICATION Complete:
                  $ref: '#/components/examples/B2BAuthenticateResponsePushNotificationComplete'
                EXAMPLE - ISSUER_RBA Initiate and Complete:
                  $ref: '#/components/examples/B2BAuthenticateResponseIssuerRba'
                EXAMPLE - FIDO2 Initiate:
                  $ref: '#/components/examples/B2BAuthenticateResponseFidoInitiate'
                EXAMPLE - FIDO2 Complete:
                  $ref: '#/components/examples/B2BAuthenticateResponseFidoComplete'
                EXAMPLE - MANAGED_AUTHENTICATION Complete:
                  $ref: '#/components/examples/B2BManagedAuthenticationResponseComplete'
                EXAMPLE - MANAGED_AUTHENTICATION Initiate:
                  $ref: '#/components/examples/B2BManagedAuthenticationResponseInitiate'

          headers:
            X-SRC-CX-FLOW-ID:
              $ref: '#/components/headers/X-SRC-CX-FLOW-ID'
        '400':
          $ref: '#/components/responses/BadRequestAuthenticate'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/ForbiddenRequestAuthenticate'
        '404':
          $ref: '#/components/responses/NotFound'
components:
  responses:
    BadRequest:
      description: "Bad Request"
      headers:
        SRC-Correlation-Id:
          description: "correlation ID for this transaction."
          schema:
            type: "string"
          example: "2fea0a89-8ebe-40dd-a37e-f58cc1ddb236"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            BadRequestExample:
              $ref: '#/components/examples/BadRequestExample'
    BadRequestAuthenticate:
      description: "Bad Request"
      headers:
        SRC-Correlation-Id:
          description: "correlation ID for this transaction."
          schema:
            type: "string"
          example: "2fea0a89-8ebe-40dd-a37e-f58cc1ddb236"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            BadRequestExample:
              $ref: '#/components/examples/BadRequestExample'
            EXAMPLE - MDES IDV INCORRECT OTP VALIDATION:
              $ref: '#/components/examples/BadRequestExampleIAO'
            EXAMPLE - 3P FIDO Assertion Validation Failed:
              $ref: '#/components/examples/BadRequest3PFIDOSPK'
            EXAMPLE - IAAV/TAV Validation INVALID POA:
              $ref: '#/components/examples/BadRequestExampleSTFTxAV'
            EXAMPLE - IAAV/TAV Validation EXPIRED POA:
              $ref: '#/components/examples/BadRequestExampleSTFExpiredTxAV'
            EXAMPLE - 3P PKI Authenticator Not bound:
              $ref: '#/components/examples/BadRequestExample3PPKI'
            EXAMPLE - APP_PUSH_NOTIFICATION Both resend and completed missing:
              $ref: '#/components/examples/BadRequestPushNotificationMissingResendCompleted'
            EXAMPLE - APP_PUSH_NOTIFICATION resend true along with completed:
              $ref: '#/components/examples/BadRequestPushNotificationInvalidateResend'
    BadRequestAuthenticators:
      description: "Bad Request"
      headers:
        SRC-Correlation-Id:
          description: "correlation ID for this transaction."
          schema:
            type: "string"
          example: "2fea0a89-8ebe-40dd-a37e-f58cc1ddb236"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            BadRequestExample:
              $ref: '#/components/examples/BadRequestExample'
            EXAMPLE - 3P FIDO Binding CREDENTIALS VALIDATION FAILED:
              $ref: '#/components/examples/BadRequestSPKValidationFailed'
            EXAMPLE - 3P FIDO Binding AUTHENTICATOR EXISTS:
              $ref: '#/components/examples/BadRequestSPKAuthenticatorExists'
            EXAMPLE - IAAV/TAV Binding INVALID AUTH TYPE IN TAV:
              $ref: '#/components/examples/BadRequestExampleTAVBind'
            EXAMPLE - IAAV/TAV Binding EXPIRED TAV:
              $ref: '#/components/examples/BadRequestTAVExpiredBind'
            EXAMPLE - IAAV/TAV Binding INVALID TAV:
              $ref: '#/components/examples/BadRequestTAVIncorrectBind'
            EXAMPLE - 3P PKI Binding INVALID Type:
              $ref: '#/components/examples/BadRequest3PPKIIncorrectType'
    Forbidden:
      description: "Forbidden"
      headers:
        SRC-Correlation-Id:
          description: "correlation ID for this transaction."
          schema:
            type: "string"
          example: "4fea0a89-8ebe-40dd-a37e-f58cc1ddb236"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            ForbiddenExample:
              $ref: '#/components/examples/ForbiddenExample'
    ForbiddenRequestAuthenticate:
      description: "Forbidden"
      headers:
        SRC-Correlation-Id:
          description: "correlation ID for this transaction."
          schema:
            type: "string"
          example: "4fea0a89-8ebe-40dd-a37e-f58cc1ddb236"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            ForbiddenExample:
              $ref: '#/components/examples/ForbiddenExample'
            EXAMPLE - MDES IDV MAXIMUM INCORRECT OTP ATTEMPTS:
              $ref: '#/components/examples/BadRequestExampleMaxOtpIAO'
    NotFound:
      description: "Not Found"
      headers:
        SRC-Correlation-Id:
          description: "correlation ID for this transaction."
          schema:
            type: "string"
          example: "5fea0a89-8ebe-40dd-a37e-f58cc1ddb236"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            NotFoundExample:
              $ref: '#/components/examples/NotFoundExample'
    Unauthorized:
      description: "Unauthorized"
      headers:
        SRC-Correlation-Id:
          description: "correlation ID for this transaction."
          schema:
            type: "string"
          example: "3fea0a89-8ebe-40dd-a37e-f58cc1ddb236"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
          examples:
            UnauthorizedExample:
              $ref: '#/components/examples/UnauthorizedExample'
  parameters:
    srcCorrelationIdHeaderOptional:
      in: header
      name: SRC-Correlation-Id
      schema:
        type: string
      description: correlation ID for this transaction.
      required: false
      example: "a6b7a964-41ff-4d6c-8cba-26c6d5a7926f"
    srcClientIdRequired:
      in: "query"
      name: "srcClientId"
      schema:
        $ref: "#/components/schemas/SrcClientId"
      description: "A unique identifier assigned by Mastercard during onboarding which signifies the responsible party Integrating to Mastercard Checkout Solutions (MCS)."
      example: "eccbf087-f159-4d69-b31d-00bec75c0474"
      required: true
    xSrcCxFlowId:
      in: "header"
      name: "X-SRC-CX-FLOW-ID"
      schema:
        type: "string"
      description: "The X-Src-Cx-Flow-Id ensures to direct all calls from the same client to the same server and maintains session affinity. When you make your initial API call, Secure Card on File responds with the X-Src-Cx-Flow-Id in the header. The X-Src-Cx-Flow-Id returned in this response should be used in the subsequent calls to ensure these calls are directed to the same server that returned the initial response. If not provided, API call may fail."
      example: "34F4A04B.B9EF8486-E8C1-44F3-88DC-D4F516A354DC.1587777300"
  headers:
    X-SRC-CX-FLOW-ID:
      schema:
        type: "string"
        pattern: "^[0-9a-zA-Z-_#]*$"
        maxLength: 255
      description: "The X-Src-Cx-Flow-Id ensures to direct all calls from the same client to the same server and maintains session affinity. When you make your initial API call, Secure Card on File responds with the X-Src-Cx-Flow-Id in the header. The X-Src-Cx-Flow-Id returned in this response should be used in the subsequent calls to ensure these calls are directed to the same server that returned the initial response. If not provided, API call may fail."
  schemas:
    ResourceId:
      type: string
      description: "A unique identifier that represents the token associated with a credential enrolled into Mastercard Checkout Solutions (MCS)."
      example: "51a977f3-bda4-498b-901d-b48ad4d97abv"
    DeviceData:
      type: object
      properties:
        type:
          type: string
          maxLength: 255
          example: Smartphones
          description: Device Type.
        information:
          type: string
          description: Device information.
          example: Device info
        manufacturer:
          type: string
          maxLength: 255
          example: Apple
          description: Device manufacturer.
        brand:
          type: string
          maxLength: 255
          example: iPhone
          description: Device Company.
        model:
          type: string
          maxLength: 255
          example: A2651
          description: Device Model.
        name:
          type: string
          example: iPhone 14
          description: Name of device.
        identifier:
          type: string
          example: a9637332-81b4-45c3-aa75-fd21e4fe17aa
          description: Unique id for device.
        status:
          type: string
          example: Active
          description: Status of device.
        appName:
          type: string
          example: Netflix
          description: Application Name.
        osName:
          type: string
          maxLength: 32
          minLength: 1
          example: ANDROID
          description: Name of the device operating system.
        osVersion:
          type: string
          maxLength: 32
          minLength: 1
          example: 4.4.4
          description: version of the device operating system.
    AssuranceData:
      type: "object"
      required:
        - "verificationData"
      properties:
        verificationData:
          type: "array"
          description: |
            "Proof of verification against the authentication performed by the authenticating entity. 
            Authenticating Entity could vary on the basis of the authentication being performed.
            Mastercard Supported External Parties or Mastercard as well"
          items:
            $ref: "#/components/schemas/VerificationData"
    AuthenticateAssuranceData:
      type: object
      required:
        - verificationData
      properties:
        verificationData:
          type: "array"
          items:
            $ref: "#/components/schemas/AuthenticateVerificationData"
          description: "Consumer verification data."
    AuthenticationContext:
      type: "object"
      description: "Contextual data to support authentication method requested."
      required:
        - authenticationReasons
      properties:
        authenticationReasons:
          type: "array"
          items:
            $ref: "#/components/schemas/AuthenticationReasons"
          description: "Reason for the authentication request"
        dpaData:
          $ref: "#/components/schemas/DpaData"
        dpaTransactionOptions:
          $ref: "#/components/schemas/DpaTransactionOptions"
        consumerDeviceData:
          $ref: "#/components/schemas/ConsumerDeviceData"
    LookupAuthenticationContext:
      type: "object"
      description: "Contextual data to support authentication method requested."
      required:
        - authenticationReasons
      properties:
        authenticationReasons:
          type: "array"
          items:
            $ref: "#/components/schemas/AuthenticationReasons"
          description: "Reason for the authentication request"
        consumerDeviceData:
          $ref: "#/components/schemas/B2BAuthenticationLookupConsumerDeviceData"
    LookupResponseAuthenticationMethods:
      type: "object"
      description: "One of the supported methods available for authenticating the enrolled card. Each supported method will have individual objects with related information under it."
      required:
        - "authenticationMethodType"
        - "authenticationSubject"
        - "authenticationReasons"
      properties:
        authenticationMethodType:
          $ref: "#/components/schemas/LookupAuthenticationMethodType"
        authenticationSubject:
          $ref: "#/components/schemas/AuthenticationSubject"
        authenticationReasons:
          $ref: "#/components/schemas/AuthenticationReasons"
        uriData:
          $ref: "#/components/schemas/UriData"
        authenticators:
          type: "array"
          items:
            $ref: "#/components/schemas/LookupResponseAuthenticator"
    MfaEligibility:
      type: object
      required:
        - certifiedSolutionId
        - isLiabilityShiftEligible
        - isMultiFactorAuthenticationSupported
      properties:
        certifiedMfaMethodId:
          type: string
          description: "Unique identifier identifying the certified MFA method. Registered after the successful certification of the MFA Method."
          deprecated: true
          example: 10001
        certifiedSolutionId:
          type: string
          description: "Unique identifier identifying the certified MFA method. Registered after the successful certification of the MFA Method."
          example: 10001
        authenticatingEntityId:
          $ref: '#/components/schemas/AuthenticatingEntityId'
        isMultiFactorAuthenticationSupported:
          type: boolean
          description: Flag indicating whether the Multi Factor Authentication is supported for the Account PAN
          example: true
        isLiabilityShiftEligible:
          type: boolean
          description: Flag indicating whether the Multi Factor Authentication method & account PAN are eligible for Fraud Liability Protection
          example: true
    AuthenticatingEntityId:
      type: string
      description: 'Unique identifier for the entity verifying a person as an authorized cardholder using a Mastercard-approved Multi-factor Authentication method in a remote commerce token transaction. When provided, will be used to delete authenticator bindings verified using the provided Authenticating Entity.'
      maxLength: 256
      example: abdcf034-f160-4d69-b31d-00bec75c0908
    AuthenticateAuthenticationMethod:
      type: "object"
      description: "One of the supported methods available for authenticating the enrolled card. Each supported method will have individual objects with related information under it."
      required:
        - "authenticationMethodType"
        - "authenticationSubject"
      properties:
        authenticationMethodType:
          $ref: "#/components/schemas/AuthenticationMethodType"
        authenticationSubject:
          $ref: "#/components/schemas/AuthenticationSubject"
        authenticator:
          $ref: '#/components/schemas/Authenticator'
        authenticationCredential:
          $ref: "#/components/schemas/AuthenticationCredential"
        authenticationCredentialReference:
          $ref: "#/components/schemas/AuthenticationCredentialReference"
        methodAttributes:
          $ref: "#/components/schemas/AuthenticateRequestMethodAttributes"
    AuthenticationMethodType:
      type: "string"
      description: |-
        Type of supported authentication method. Valid values are:
          * SMS_OTP
          * EMAIL_OTP
          * IAAV
          * FIDO2
          * PROPRIETARY
          * APP_AUTHENTICATION
          * APP_PUSH_NOTIFICATION
          * ISSUER_RBA
      example: "SMS_OTP"
    LookupAuthenticationMethodType:
      type: "string"
      description: |-
        Type of supported authentication method. Valid values are:
          * 3DS
          * MANAGED_AUTHENTICATION
          * ONBEHALF_ISSUER_IDV
          * SMS_OTP
          * EMAIL_OTP
          * APP_AUTHENTICATION
          * APP_PUSH_NOTIFICATION
          * ISSUER_RBA
          * FIDO2
      example: "FIDO2"
    AuthenticationReasons:
      type: "string"
      description: |-
        The reason for this authentication request. Valid values are:
          * ENROLL_FINANCIAL_INSTRUMENT
          * TRANSACTION_AUTHENTICATION
          * CONSUMER_IDENTITY_VALIDATION
          * AUTHENTICATOR_REGISTRATION
      pattern: "ENROLL_FINANCIAL_INSTRUMENT|TRANSACTION_AUTHENTICATION|CONSUMER_IDENTITY_VALIDATION|AUTHENTICATOR_REGISTRATION"
      example: "TRANSACTION_AUTHENTICATION"
    AuthenticationSubject:
      type: "string"
      description: |-
        The entity which is the subject of this authentication request. Valid values are:
          * CARDHOLDER
    B2BLookupRequestAuthentication:
      type: "object"
      required:
        - "srcClientId"
        - "authenticationContext"
        - "serviceId"
        - "srcDigitalCardId"
      properties:
        srcClientId:
          $ref: "#/components/schemas/SrcClientId"
        serviceId:
          $ref: "#/components/schemas/ServiceId"
        srcCorrelationId:
          $ref: "#/components/schemas/SrcCorrelationId"
        accountReference:
          $ref: '#/components/schemas/AccountReference'
        authenticationContext:
          $ref: "#/components/schemas/LookupAuthenticationContext"
        srcDigitalCardId:
          $ref: "#/components/schemas/SrcDigitalCardId"
        srcDpaId:
          $ref: "#/components/schemas/SrcDpaId"
    B2BLookupResponseAuthentication:
      type: "object"
      required:
        - "srcCorrelationId"
        - "authenticationMethods"
      properties:
        srcCorrelationId:
          $ref: "#/components/schemas/SrcCorrelationId"
        srciTransactionId:
          $ref: "#/components/schemas/SrciTransactionId"
        authenticationMethods:
          type: "array"
          description: "List of available authentication methods for the provided card."
          items:
            $ref: "#/components/schemas/LookupResponseAuthenticationMethods"
        mfaEligibility:
          type: array
          description: Container for information on Multi Factor Authentication eligibility
          items:
            $ref: "#/components/schemas/MfaEligibility"
    BindMfaRequestMethod:
      type: "object"
      required:
        - "srcClientId"
        - "serviceId"
        - "srcDigitalCardId"
        - "assuranceData"
      description: "The Bind MFA operation binds a MFA method instance to a FPAN/srcDigitalCardId and/or consumer Identifier, e.g, email Address, mobile number etc."
      properties:
        srcClientId:
          $ref: "#/components/schemas/SrcClientId"
        srcCorrelationId:
          $ref: "#/components/schemas/SrcCorrelationId"
        serviceId:
          type: "string"
          description: "Identifies a relevant / requested service (program). This ID is assigned by Mastercard."
          maxLength: 255
          example: "SECURE_COF_COMMERCE_PLATFORM#SAMPLE_MERCHANT#01"
        srcDigitalCardId:
          $ref: "#/components/schemas/SrcDigitalCardId"
        accountReference:
          $ref: "#/components/schemas/AccountReference"
        mfaMethod:
          $ref: "#/components/schemas/BindMfaMethod"
        authenticator:
          $ref: "#/components/schemas/Authenticator"
        assuranceData:
          $ref: "#/components/schemas/AssuranceData"
        bindingAssertionJWT:
          $ref: "#/components/schemas/BindingAssertionJWT"
        consumerDeviceData:
          $ref: "#/components/schemas/ConsumerDeviceData"
        srcDpaId:
          $ref: "#/components/schemas/SrcDpaId"
    BindMfaResponseMethod:
      type: "object"
      required:
        - srcCorrelationId
        - credentialId
      properties:
        srcCorrelationId:
          $ref: "#/components/schemas/SrcCorrelationId"
        externalMfaMethodInstanceId:
          $ref: '#/components/schemas/ExternalMfaMethodInstanceId'
        mfaMethodInstanceId:
          $ref: '#/components/schemas/MfaMethodInstanceId'
        credentialId:
          $ref: '#/components/schemas/credentialId'
        externalCredentialId:
          $ref: '#/components/schemas/externalCredentialId'
    AccountReference:
      type: object
      description: >-
        Details of account to be used for authentication.
      deprecated: true
      properties:
        srcDigitalCardId:
          $ref: "#/components/schemas/SrcDigitalCardId"
    MfaMethodInstances:
      type: object
      properties:
        externalMfaMethodInstanceId:
          $ref: '#/components/schemas/ExternalMfaMethodInstanceId'
        mfaMethodInstanceId:
          $ref: '#/components/schemas/MfaMethodInstanceId'
        resourceId:
          $ref: "#/components/schemas/ResourceId"
    ExternalMfaMethodInstanceId:
      type: "string"
      description: "Client supplied unique identifier identifying the MFA Method Instance. Conditional – required if mfaMethodInstanceId not present."
      deprecated: true
      maxLength: 128
      example: "bf8c5b2b-28ce-48d8-acbc-cc82f51478c6"
    MfaMethodInstanceId:
      type: "string"
      description: "Mastercard generated unique identifier identifying the MFA Method Instance. Conditional – required if externalMfaMethodInstanceId not present."
      deprecated: true
      maxLength: 128
      example: "pd295b2b-66ce-48d8-acbc-cc82f51479d8"
    BindingAssertionJWT:
      type: "string"
      description: "JWT provided by Authenticating Entity (AE) to facilitate verified binding to a Multi-factor Authentication (MFA) method."
      deprecated: true
      example: "eyJ0eXAiOiJKV1QrZXh0LmJpbmRpbmdfYXNzZXJ0aW9uX3Rva2VuIiwiYWxnIjoiUlMyNTYifQ..KFAfUG62XeKQCC6Ax89jAXCPVl-ETa6ZvyVhu4eQf64fTAdAmHS0yjSA92QP285dLAs1Q9lyNym9eoaZDByvwQSIEhym6deu0bltLYe1we9Owd7ssoRdoFaYR3T59Ma5dPlC-POmy_-SCA8YX_6aKJn3ZUVI1cVystpPMLAtDfL0OHVwFkgkWj7HtxgtSImDL8bueYsxo-0d38VTfJ5tIvVzB6V8J-uNdhtNU6Mxywl8eKtO0pSl00bibM2JHbTYTaq6_o2FhvE5GHVl_PiJYhDRMyKuZDimwIBMi3UXIuzqCFgeFJL3h6XAhmOG0eFQW99QmaLVzU6Gj4CuCWYQfA"

    RequestAuthenticate:
      type: object
      required:
        - srcClientId
        - srcCorrelationId
        - authenticationMethod
        - serviceId
        - srcDigitalCardId
      properties:
        srcClientId:
          $ref: '#/components/schemas/SrcClientId'
        serviceId:
          $ref: '#/components/schemas/ServiceId'
        srcCorrelationId:
          $ref: '#/components/schemas/SrcCorrelationId'
        srciTransactionId:
          $ref: '#/components/schemas/SrciTransactionId'
        srcDigitalCardId:
          $ref: '#/components/schemas/SrcDigitalCardId'
        accountReference:
          $ref: "#/components/schemas/AccountReference"
        authenticationSessionId:
          $ref: "#/components/schemas/AuthenticationSessionId"
        authenticationMethod:
          $ref: '#/components/schemas/AuthenticateAuthenticationMethod'
        authenticationContext:
          $ref: '#/components/schemas/AuthenticationContext'
        assuranceData:
          $ref: '#/components/schemas/AssuranceData'
        srcDpaId:
          $ref: "#/components/schemas/SrcDpaId"
    ResponseAuthenticate:
      type: object
      required:
        - srcCorrelationId
        - authenticationStatus
        - authenticationResult
      properties:
        srcCorrelationId:
          $ref: '#/components/schemas/SrcCorrelationId'
        srciTransactionId:
          $ref: "#/components/schemas/SrciTransactionId"
        authenticationSessionId:
          $ref: "#/components/schemas/AuthenticationSessionId"
        authenticationSessionExpiry:
          $ref: "#/components/schemas/AuthenticationSessionExpiry"
        authenticationStatus:
          $ref: "#/components/schemas/AuthenticationStatus"
        authenticationResult:
          $ref: "#/components/schemas/AuthenticationResult"
        methodAttributes:
          $ref: "#/components/schemas/AuthenticateResponseMethodAttributes"
        assuranceData:
          $ref: "#/components/schemas/AuthenticateAssuranceData"
        sessionAssuranceValue:
          $ref: '#/components/schemas/SessionAssuranceValue'
    AuthenticationSessionId:
      type: string
      description: "Unique authentication session identifier (UUID) generated by MACS. Conditional: Required when retrieving result of authentication."
      minLength: 1
      maxLength: 255
      example: "86bd4a91-46ba-4b2c-9b4a-59eea3812f06"
    AuthenticationSessionExpiry:
      type: string
      description: "Time by when the authentication assurance data expires - UTC time in UNIX epoch format."
      example: "1678294563"
    AuthenticationStatus:
      type: string
      description: |
        Status of the authentication attempted by the consumer.
        Valid values are:
        
        * PENDING - Authentication process is in progress and requires another operation to be completed.
        * COMPLETE - Authentication process is complete.
      minLength: 1
      maxLength: 30
      example: "COMPLETE"
    AuthenticationResult:
      type: string
      description: |
        Result of the authentication attempted by the consumer.
        Valid values are:
        
        * AUTHENTICATED - Request has been authenticated.
        * NOT_AUTHENTICATED - Request was not authenticated.
        * NOT_SUPPORTED - Requested authentication operation was not supported.
      minLength: 1
      maxLength: 30
      example: "AUTHENTICATED"
    SessionAssuranceValue:
      type: string
      description: "Base-64 encoded JWT token with session data.This value will only be returned in the first 'initiate' call for the authenticate api when authenticationMethodType is 'FIDO2' or 'MANAGED_AUTHENTICATION"
      example: ""
    UnbindMfaResponseMethod:
      type: "object"
      required:
        - srcCorrelationId
      properties:
        srcCorrelationId:
          $ref: "#/components/schemas/SrcCorrelationId"
        mfaMethodInstances:
          type: array
          deprecated: true
          description: "List of mfaMethodInstances"
          items:
            $ref: '#/components/schemas/MfaMethodInstances'
        unboundCredentials:
          type: array
          description: List of credentials that were deleted or unlinked from the unbind authenticator request.
          items:
            $ref: '#/components/schemas/UnboundCredentials'
    UnboundCredentials:
      type: object
      required:
        - credentialId
      properties:
        externalCredentialId:
          $ref: '#/components/schemas/externalCredentialId'
        credentialId:
          $ref: '#/components/schemas/credentialId'
        resourceId:
          $ref: "#/components/schemas/ResourceId"
    DpaData:
      type: object
      properties:
        acquirerId:
          type: string
          description: "Acquiring institution identification code for 3DS. Conditionality: This is required for authenticationMethodType = 3DS or MANAGED_AUTHENTICATION"
          example: "DE149872"
        acquirerBin:
          type: string
          description: "Acquiring institution BIN, as provided during 3DS onboarding. Conditionality: This is required for authenticationMethodType = 3DS or MANAGED_AUTHENTICATION"
          example: "545301"
    DpaTransactionOptions:
      type: object
      required:
        - dpaLocale
      properties:
        transactionAmount:
          $ref: '#/components/schemas/TransactionAmount'
        dpaLocale:
          type: string
          description: "Client locale preference"
          example: "en_US"
        merchantName:
          type: string
          description: "Integrator's legal name that is registered as DPA or Agent with Mastercard. The maximum length of this parameter is 40 bytes."
          example: "Best Buy"
        merchantCategoryCode:
          description: Code representing merchant's type of business, product OR service.
          example: "4444"
          type: string
        merchantCountryCode:
          type: string
          description: ISO-3166 country code of the merchant
          example: "US"
        threeDsInputData:
          type: object
          description: |
            The object consists of the information related to 3DS authentication.
          properties:
            billingAddress:
              type: object
              required:
                - zip
              properties:
                name:
                  type: string
                  example: "John Doe"
                  description: "Name of the person at the address"
                line1:
                  type: string
                  maxLength: 75
                  description: First line of the address
                  example: "100 Avenue Lane Street"
                line2:
                  type: string
                  maxLength: 75
                  description: "Second line of the address"
                  example:  "Address line 2"
                state:
                  type: string
                  description: "Address of the state"
                  maxLength: 30
                  example: "NJ"
                zip:
                  type: string
                  maxLength: 20
                  description: "Zip/postal Code"
                  example: "98410"
                countryCode:
                  type: string
                  maxLength: 2
                  description: "Address Country Code ISO 3166 Alpha Country Code"
                  example: "US"
    TransactionAmount:
      type: object
      description: |
        Transaction data assocaited with the digital transaction. 
        Required when TRANSACTION AUTHENTICATION has been requested.
      required:
        - transactionAmount
        - transactionCurrencyCode
      properties:
        transactionAmount:
          type: "string"
          description: "The amount of the transaction, represented as a floating-point number."
          example: "60.98"
        transactionCurrencyCode:
          type: "string"
          description: "ISO 4217 currency code, both numeric and alpha-numeric values are supported)"
          example: "USD"
    B2BAuthenticationLookupConsumerDeviceData:
      type: object
      description: |
        Device data assocaited to the consumer device. 
        User Agent, Screen Height and Screen Width are needed to perform the probabilistic 
        assessment of authenticators.
      properties:
        appInstanceId:
          type: "string"
          description: "Client-generated universally unique identifier for the consumer device instance"
          minLength: 1
          maxLength: 36
          example: "05c666b6-c833-46c2-a4ab-6321fc3cfe8c"
        userAgent:
          type: string
          description: "Browser user agent"
          example: "Mozilla/5.0 (Windows NT 6.1; Win64; x64; rv:64.0) Gecko/20100101 Firefox/64.0"
        screenHeight:
          type: integer
          description: "Window screen height"
          example: 1440
        screenWidth:
          type: integer
          description: "Window screen width"
          example: 2560
    ConsumerDeviceData:
      type: object
      properties:
        deviceRecognitionToken:
          type: string
          example: JWT
          description: JWT token having device informatin claim.
        userAgent:
          type: string
          description: User agent string of the connecting client application.
          example: Mozilla/5.0 (Windows NT 6.1; Win64; x64; rv:64.0) Gecko/20100101 Firefox/64.0
          minLength: 1
          maxLength: 1024
        screenHeight:
          type: integer
          description: Screen height.
          minLength: 1
          maxLength: 9
          example: 1440
        screenWidth:
          type: integer
          description: Screen width.
          minLength: 1
          maxLength: 9
          example: 2560
        appInstanceId:
          type: string
          description: Client-generated universally unique identifier for the consumer device / app instance
          example: 05c666b6-c833-46c2-a4ab-6321fc3cfe8c
          minLength: 1
          maxLength: 36
        deviceData:
          $ref: '#/components/schemas/DeviceData'
        nickName:
          type: string
          minLength: 1
          maxLength: 30
          description: Nick name.
          example: iPhone
        spcEnabled:
          type: boolean
          example: true
          default: false
          description: SPC supported on the current device
        userAgentName:
          type: string
          example: Chrome
        userAgentVersion:
          type: string
          example: 91.0.4472.124
        fidoSupported:
          type: string
          example: true
    AuthenticationCredential:
      type: "string"
      description: Credentials for authentication according to the type specified in authenticationMethodType if IAAV.
      deprecated: true
      example: ""
    AuthenticationCredentialReference:
      type: "string"
      description: Credentials for authentication according to the type specified in authenticationMethodType. Can be a masked phone number or email.
      example: 12X-XXX-XX32 or abcxxxxx@gmxx.com
    AuthenticateRequestMethodAttributes:
      type: object
      description: Contains details related to any authentication methods which require supplemental attributes.
      properties:
        otpValue:
          type: "string"
          description: "Authentication code of 4 digits received by EMAIL or SMS."
          example: "9867"
        boundMfaMethod:
          $ref: '#/components/schemas/AuthenticateBoundMfaMethod'
        associatedAccountDetails:
          $ref: '#/components/schemas/AssociatedAccountDetails'
        pushNotification:
          $ref: '#/components/schemas/PushNotification'
    AuthenticateResponseMethodAttributes:
      type: object
      description: "Contains details related to the authentication method, like OTP, authenticator details, etc."
      properties:
        otpValue:
          type: "string"
          description: "A shared secret such as One Time Passcode (OTP)"
          example: "9867"
        boundMfaMethod:
          $ref: '#/components/schemas/AuthenticateBoundMfaMethod'
        uriData:
          $ref: "#/components/schemas/UriData"
        pushNotification:
          $ref: '#/components/schemas/PushNotification'
        platforms:
          $ref: '#/components/schemas/Platforms'
    Platforms:
      type: object
      description: Contains details related to app or deep link to launch the Android and IOS Issuer App.
      properties:
        android:
          $ref: '#/components/schemas/AndroidPlatform'
        ios:
          $ref: '#/components/schemas/IOSPlatform'
    AndroidPlatform:
      type: object
      description: Contains details related to app or deep link to launch the Android Issuer App.
      properties:
        intent:
          $ref: '#/components/schemas/PlatformIntent'
        appLink:
          $ref: '#/components/schemas/PlatformLink'
    IOSPlatform:
      type: object
      description: Contains details related to app or deep link to launch the IOS Issuer App.
      properties:
        appLink:
          $ref: '#/components/schemas/PlatformLink'
        deepLink:
          $ref: '#/components/schemas/PlatformLink'
    PlatformIntent:
      type: object
      description: AndroidIntent object can be used to open the issuer mobile app
      required:
        - action
        - packageName
        - payload
      properties:
        action:
          $ref: '#/components/schemas/PlatformAction'
        packageName:
          $ref: '#/components/schemas/PlatformPackageName'
        payload:
          $ref: '#/components/schemas/PlatformPayload'
    PlatformLink:
      type: object
      description: Contains details related to URL and Payload for the related platform to launch App Authentication.
      required:
        - url
        - payload
      properties:
        url:
          $ref: '#/components/schemas/PlatformUrl'
        payload:
          $ref: '#/components/schemas/PlatformPayload'
    PlatformAction:
      type: "string"
      description: "The name of the action to be performed. This is a fully qualified name including the package name in order to create an explicit intent."
      example: "com.mybank.bankingapp.action.OPEN_ISSUER_MOBILE_APP"
      maxLength: 128
      minLength: 1
    PlatformPackageName:
      type: "string"
      description: "The package name of the issuer''s mobile app. This identifies the app that the intent will resolve to. If the app is not installed on the user''s device, this package name can be used to open a link to the appropriate Android app store for the user to download and install the app."
      example: "com.mybank.bankingapp"
      maxLength: 128
      minLength: 1
    PlatformPayload:
      type: "string"
      minLength: 1
      description: "Contains the data to be passed through to the target app in the intent as an extra key/value pair with key ''android.intent.extra.TEXT''.  This is Base64-encoded data of a JSON object. The object type of this extraTextValue will depend on context, and is documented wherever AndroidIntent is being used."
      example: "ew0KICAgICJwYXltZW50QXBwUHJvdmlkZXJJZCI6ICIxMjM0NTY3ODkiLA0KICAgICJwYXltZW50QXBwSWQiOiAiV2FsbGV0QXBwMSIsDQogICAgInBheW1lbnRBcHBJbnN0YW5jZUlkIjogIjEyMzQ1Njc4OSIsDQogICAgInRva2VuVW5pcXVlUmVmZXJlbmNlIjogIkRXU1BNQzAwMDAwMDAwMGZjYjJmNDEzNmIyZjQxMzZhMDUzMmQyZjQxMzZhMDUzMiINCn0="
    PlatformUrl:
      type: "string"
      description: "The deep linking URL of the issuer''s iOS mobile app. This identifies the app that the URL will resolve to. If the app is not installed on the user''s device, this URL can be used to open a link to the appropriate iOS app store for the user to download and install the app."
      example: "bankingapp:tokenize"
      minLength: 1

    PushNotification:
      type: object
      properties:
        payload:
          type: "string"
          description: "Payload provided by issuer for push notification. Integrator should provide in authenticate request."
          example: "ewogICJwYXltZW50QXBwUHJvdmlkZXJJZCI6ICIxMjM0NTY3ODkiLAogICJwYXltZW50QXBwSW5zdGFuY2VJZCI6ICIxMjM0NTY3ODkiLAogICJ0b2tlblVuaXF1ZVJlZmVyZW5jZSI6ICJEV1NQTUMwMDAwMDAwMDBmY2IyZjQxMzZiMmY0MTM2YTA1MzJkMmY0MTM2YTA1MzIiLAogICJhY2NvdW50UGFuU3VmZml4IjogIjY3ODkiLAogICJhY2NvdW50RXhwaXJ5IjogIjEwMTgiCn0="
        resend:
          type: boolean
          default: false
          description: "Indicates if the request is for resending the push notification."
          example: false
        completed:
          type: boolean
          default: false
          description: "Indicates if requesting result of push notification authentication."
          example: false
    AssociatedAccountDetails:
      type: object
      minProperties: 1
      properties:
        emailAddress:
          type: string
          pattern: "^[a-zA-Z0-9_!#$%&'*+/=?{|}~^.-]+@[A-Za-z0-9.-]+\\.[A-Za-z]{2,63}$"
          minLength: 6
          maxLength: 255
          description: "Valid email address."
          example: "user@example.com"
        phoneNumber:
          $ref: '#/components/schemas/PhoneNumber'
    PhoneNumber:
      type: object
      required:
        - countryCode
        - phoneNumber
      properties:
        countryCode:
          type: string
          description: "Country code for phone numbers, formatted as an international calling code. Input should only contain numbers, without the plus sign."
          pattern: '^[0-9]+$'
          minLength: 1
          maxLength: 4
          example: "1"
        phoneNumber:
          type: string
          description: "Phone number without country code."
          pattern: '^[0-9]+$'
          minLength: 4
          maxLength: 14
          example: "4155552671"
    AuthenticateBoundMfaMethod:
      type: object
      deprecated: true
      required:
        - mfaMethod
      properties:
        mfaMethod:
          $ref: '#/components/schemas/AuthenticateMfaMethod'
    AuthenticateMfaMethod:
      type: object
      required:
        - type
        - certifiedMfaMethodId
        - assertionData
        - fidoMfaMethodData
      properties:
        type:
          $ref: '#/components/schemas/AuthenticateMfaMethodType'
        certifiedMfaMethodId:
          $ref: '#/components/schemas/certifiedMfaMethodId'
        externalMfaMethodInstanceId:
          $ref: '#/components/schemas/ExternalMfaMethodInstanceId'
        mfaMethodInstanceId:
          $ref: '#/components/schemas/MfaMethodInstanceId'
        assertionData:
          $ref: '#/components/schemas/AssertionData'
        fidoMfaMethodData:
          $ref: "#/components/schemas/FidoMFAMethodData"
    AuthenticateMfaMethodType:
      type: string
      enum:
        - PROPRIETARY
        - FIDO2
      description: "Type of the MFA Method"
    certifiedMfaMethodId:
      type: "string"
      description: "Unique identifier identifying the certified MFA method. Registered after the successful certification of the MFA Method."
      maxLength: 128
      example: "43SA5"
    externalCredentialId:
      type: string
      description: "Client supplied unique identifier identifying the Credential Instance. Conditional – required if present in the request."
      minLength: 1
      maxLength: 128
      example: 39479fd5-53b0-4802-bb13-91518c9f9e35
    credentialId:
      type: string
      description: "Mastercard generated unique identifier identifying the Credential Instance."
      minLength: 1
      maxLength: 128
      example: pd295b2b-66ce-48d8-acbc-cc82f51479d8
    AssertionData:
      type: object
      description: "Carries either the PublicKeyCredential object from the FIDO authenticator or carries the PoA generated by either the TAF client or Mastercard."
      properties:
        publicKeyCredentials:
          $ref: "#/components/schemas/PublicKeyCredentials"
        assertion:
          type: "string"
          description: "Base64 Encoded - B2B Client Assertion JWT"
          example: ""
    PublicKeyCredentials:
      type: object
      description: "JSON Object carrying the PublicKeyCredential object from the FIDO authenticator on the consumer device."
      required:
        - id
        - type
        - response
      properties:
        id:
          type: string
          description: "Type of the PublicKeyCredentialType."
          example: "CUep7xrHEeKmGAU7g4GkGhRnfJPgjDkvfl7VrC-Rx30"
        type:
          type: string
          description: "whose value is of PublicKeyCredentialType, defaulting to public-key."
          example: "public-key"
        response:
          $ref: "#/components/schemas/ResponsePublicKeyCredentials"
    ResponsePublicKeyCredentials:
      type: object
      description: "A new AuthenticatorAssertionResponse object associated with global."
      properties:
        authenticatorData:
          type: string
          description: "A new ArrayBuffer, created using global’s %ArrayBuffer%, containing the bytes of assertionCreationData.authenticatorDataResult."
          example: "DXX8xWP9p3nbLjQ-6kiYiHWLeFSdSTpP2-oc2WqjHMQFAAAAAT"
        clientDataJSON:
          type: string
          description: "This attribute, inherited from AuthenticatorResponse, contains the JSON-compatible serialization of client data."
          example: "eyJ0eXBlIjoid2ViYXV0aG4uZ2V0IiwiY2hhbGxlbmdlIjoiWkNlOEM0enQ1akRXSDR4a1FMOXlpaFF0Y0kyczlBa3UzazF3ZkRpSXNQMCIsIm9yaWdpbiI6Imh0dHBzOi8vdHJ5LXdlYmF1dGhuLmFwcHNwb3QuY29tIiwiY3Jvc3NPcmlnaW4iOmZhbHNlfQ"
        signature:
          type: string
          description: "A new ArrayBuffer, created using global’s %ArrayBuffer%, containing the bytes of assertionCreationData.signatureResult."
          example: "MEUCIH7xuaCcSVKR46CGfozxN9-lV2LA-DcEsK51vNbQuzIOAiEAnKkGczandIHhSmzrcXlibdxL6321qt-y-vFP5IkS4f4"
        userHandle:
          type: string
          description: "Is the fidoUserId value provided in the successful FIDO enrollment operation."
          example: "ca7ac6fe-1eec-11ed-861d-0242ac120002"
    PublicKeyCredential:
      type: object
      description: "JSON Object carrying the PublicKeyCredential object from the FIDO authenticator on the consumer device."
      required:
        - id
        - type
        - response
      properties:
        id:
          type: string
          description: "A probabilistically-unique byte sequence identifying a public key credential source and its authentication assertions."
          example: "CUep7xrHEeKmGAU7g4GkGhRnfJPgjDkvfl7VrC-Rx30"
        type:
          type: string
          description: "whose value is of PublicKeyCredentialType, defaulting to public-key."
          example: "public-key"
        response:
          $ref: "#/components/schemas/PublicKeyResponseCredential"
    PublicKeyResponseCredential:
      type: object
      description: "A new AuthenticatorAssertionResponse object associated with global."
      properties:
        attestationObject:
          type: string
          description: "This attribute, inherited from AuthenticatorResponse, contains the JSON-compatible serialization of client data."
          example: "o2NmbXRmcGFja2VkZ2F0dFN0bXSiY2FsZyZjc2lnWEYwRAIgOepNibmXlvVm5VI1gYzbdNVATbFBUZpG1bi5mVQ2sJ8CIEO-7oXi2g8nAiYvXUrbOVLptjCJMhzk_1benl62HnNkaGF1dGhEYXRhWKS9ssTbAjmJGeq0ZdD3RcwD-b8ZvFnuD5Zv3AdI8v9Iv0UAAAAArc4AAjW8xgpkiwsl8fBVAwAg-D2-krcXWAaZEAZcGj97-WLuKj130R9DZOjm5Jc_OBOlAQIDJiABIVggB7pywK6hLz5krpwiaXKlp6K5hPVEIoROu1TbJu4bHtkiWCBX5tODTZHVQyQRSV16467c5F6d256-b-bAX8LrtrC-og"
        clientDataJSON:
          type: string
          description: "This attribute, inherited from AuthenticatorResponse, contains the JSON-compatible serialization of client data."
          example: "eyJ0eXBlIjoid2ViYXV0aG4uZ2V0IiwiY2hhbGxlbmdlIjoiWkNlOEM0enQ1akRXSDR4a1FMOXlpaFF0Y0kyczlBa3UzazF3ZkRpSXNQMCIsIm9yaWdpbiI6Imh0dHBzOi8vdHJ5LXdlYmF1dGhuLmFwcHNwb3QuY29tIiwiY3Jvc3NPcmlnaW4iOmZhbHNlfQ"
    FidoMFAMethodData:
      type: object
      properties:
        relyingParty:
          $ref: "#/components/schemas/RelyingParty"
        fidoUserId:
          $ref: "#/components/schemas/FidoUserId"
        isSpcEnabled:
          $ref: "#/components/schemas/IsSpcEnabled"
    RelyingParty:
      type: string
      description: "Relying Party Identifier as defined in Web Authentication API"
      minLength: 0
      maxLength: 1024
      example: "mastercard.com"
    FidoUserId:
      type: string
      description: "User Id as associated with the FIDO2 credentials"
      minLength: 36
      maxLength: 128
      example: "ca7ac6fe-1eec-11ed-861d-0242ac120002"
    IsSpcEnabled:
      type: boolean
      description: "Indicates whether the FIDO2 authenticator is SPC enabled"
      default: false
      example: false
    Error:
      type: "object"
      required:
        - "status"
        - "reason"
        - "message"
      properties:
        status:
          type: "integer"
          description: "HTTP status code."
          format: "int32"
          example: 404
        reason:
          $ref: "#/components/schemas/ErrorReason"
        message:
          type: "string"
          description: "Error message details."
          example: "Entity not found"
        errordetail:
          description: "List of Errors."
          items:
            $ref: "#/components/schemas/ErrorDetail"
          type: "array"
    ErrorDetail:
      type: "object"
      required:
        - "reason"
      properties:
        reason:
          $ref: "#/components/schemas/ErrorDetailReason"
        message:
          type: "string"
          description: "Error message received in the error response."
          example: "Entity not found"
        sourceType:
          $ref: "#/components/schemas/ErrorSourceType"
        source:
          type: "string"
          description: "Error source from where the error has originated."
          example: "BODY"
    ErrorDetailReason:
      type: "string"
      description: "Error reason."
      nullable: true
    ErrorReason:
      type: "string"
      description: "Error status."
      nullable: true
    ErrorSourceType:
      type: "string"
      description: "Source of error."
      nullable: true
    BindMfaMethod:
      type: object
      deprecated: true
      required:
        - "type"
        - "certifiedMfaMethodId"
      properties:
        type:
          $ref: '#/components/schemas/MfaMethodType'
        externalAuthMethodId:
          type: "string"
          description: "Unique identifier identifying the certified MFA method. Registered after the successful certification of the MFA Method."
          maxLength: 128
          example: "e1b39e49-5bcf-4a2a-9e54-778db2337455"
        certifiedMfaMethodId:
          type: "string"
          description: "Unique identifier identifying the certified MFA method. Registered after the successful certification of the MFA Method."
          maxLength: 128
          example: "10001"
        externalMfaMethodInstanceId:
          $ref: '#/components/schemas/ExternalMfaMethodInstanceId'
        mfaMethodInstanceId:
          $ref: '#/components/schemas/MfaMethodInstanceId'
        assertionData:
          $ref: '#/components/schemas/AssertionData'
        fidoMfaMethodData:
          $ref: '#/components/schemas/FidoAuthenticatorData'
    LookupResponseAuthenticator:
      type: object
      description: "Carries authenticator and credential details."
      required:
        - type
        - certifiedSolutionId
        - credentialId
        - status
      properties:
        type:
          $ref: '#/components/schemas/AuthenticatorType'
        certifiedSolutionId:
          type: string
          description: "Unique identifier identifying the certified solution. Registered after the successful certification of the Authenticator solution."
          maxLength: 128
          example: 10001
        externalCredentialId:
          $ref: '#/components/schemas/externalCredentialId'
        credentialId:
          $ref: '#/components/schemas/credentialId'
        status:
          $ref: '#/components/schemas/AuthenticatorStatus'
    Authenticator:
      type: object
      description: "Contains details of authenticator, like Solution ID, Credential ID, attestations related to authenticator, etc. "
      required:
        - type
        - certifiedSolutionId
        - credentials
      properties:
        type:
          $ref: '#/components/schemas/AuthenticatorType'
        certifiedSolutionId:
          type: string
          description: "Unique identifier identifying the certified solution. Registered after the successful certification of the Authenticator solution."
          maxLength: 128
          example: 10001
        externalCredentialId:
          type: string
          description: "Client supplied unique identifier identifying the Credential Instance. Conditional – required if credentialId not present."
          maxLength: 128
          example: 39479fd5-53b0-4802-bb13-91518c9f9e35
        credentialId:
          type: string
          description: "Mastercard generated unique identifier identifying the Credential Instance. Conditional – required if externalCredentialId not present."
          minLength: 1
          maxLength: 128
          example: pd295b2b-66ce-48d8-acbc-cc82f51479d8
        credentials:
          $ref: '#/components/schemas/Credentials'
        status:
          $ref: '#/components/schemas/AuthenticatorStatus'
        metadata:
          $ref: '#/components/schemas/AuthenticatorMetaData'
    Credentials:
      type: object
      description: "Carries either the PublicKeyCredential object from the FIDO authenticator or carries the PoA generated by either the TAF client or Mastercard."
      properties:
        attestation:
          type: object
          description: "JSON Object carrying attestation collected from the Cardholder to create a binding. Conditional: Required when binding the card to a new authenticator."
          example:
            "{\"id\":\"7COhQkIRp-hIrYQc8Z9CPwYiKotvX6NnW-ZC2HhKvDY\",\"type\":\"public-key\",\"response\":{\"clientDataJSON\":\"\",\"attestationObject\":\"o2NmbXRkbm9uZWdhdHRTdG10oGhhdXRoRGF0YVikDXX8xWP9p3nbLjQ-6kiYiHWLeFSdSTpP2-oc2WqjHMRFAAAAAK3OAAI1vMYKZIsLJfHwVQMAIOwjoUJCEafoSK2EHPGfQj8GIiqLb1-jZ1vmQth4Srw2pQECAyYgASFYIFeNOX1u9oROwDM9Zp9ijL7GgOFwPvHsF1cnTF-49phBIlggav4USQz5CYoQdXv5oW-0gCZ3D0dEvdgvnraI1QSLHiY\"}}"
        assertion:
          $ref: '#/components/schemas/Assertion'
    Assertion:
      type: object
      description: "Carries assertions generated by device and client. Conditional: Required when authenticating an existing MFA binding."
      properties:
        device:
          type: object
          description: "JSON Object carrying assertion collected from the Cardholder to validate an existing binding."
          example:
            "{\"id\":\"7COhQkIRp-hIrYQc8Z9CPwYiKotvX6NnW-ZC2HhKvDY\",\"rawId\":\"7COhQkIRp-hIrYQc8Z9CPwYiKotvX6NnW-ZC2HhKvDY\",\"response\":{\"authenticatorData\":\"DXX8xWP9p3nbLjQ-6kiYiHWLeFSdSTpP2-oc2WqjHMQFAAAAAA\",\"clientDataJSON\":\"eyJ0eXBlIjoid2ViYXV0aG4uZ2V0IiwiY2hhbGxlbmdlIjoiZzR4MUtFX1lZajlpdGRUSzFvVE04Q2RXV1FBZndicTg0VVVnVC1rOUtBOCIsIm9yaWdpbiI6Imh0dHBzOi8vdHJ5LXdlYmF1dGhuLmFwcHNwb3QuY29tIiwiY3Jvc3NPcmlnaW4iOmZhbHNlfQ\",\"signature\":\"MEUCIAaVl8A-tIe5fJMUTaqzvEOg1wIrO76D0Ng3-MccIa4jAiEAxBUiTJHYCojXRtx_29RXeRBtLhLP8nVG1D1uzFwLHB8\",\"userHandle\":\"b6eaec38-d05c-4899-bac3-d162379918ae\"},\"type\":\"public-key\"}"
        client:
          type: string
          description: "Base64 encoded object carrying assertion from Cardholder's device for when authenticator assertion was generated. Provided by the Integrator after capturing cardholder's assertion for MFA authentication"
          example: "eyJ0eXAiOiJKV1QrZXh0LmJpbmRpbmdfYXNzZXJ0aW9uX3Rva2VuIiwiYWxnIjoiUlMyNTYifQ..T2KBuHcOZ81ZEAu9WvxO8a9DSnhfS5wsOYJCjmiUv2TocF-MK55r0-a-p8Ja5-Dq8ff6TDGTapRt6T6-Kzj80fqqVYnU1ghGyM3fVTlBqfRFD4IWrtk-KQx73J6yI5yy46ZvcWGHyfY0-sxNkc04lLgsJKXGwtu9Tj2RP2x_GzC5fk_70a8dSWr3pl0M-I_VhjkKppyeX1b1EBOsCIMdyLRmJm4cRonnQzntsOAPFWC9epBO3BD8UVRezywIqwlcMbLYPmqUKcTGVCTsB0vnCKjbCMn9L18cvQibeiqpasgsbDJu1QDUNN35LamUeyU228OFhdAOCryIl6auSQIXCw"
    AuthenticatorMetaData:
      type: object
      description: "Carries authenticator metadata or additional information."
      properties:
        relyingParty:
          $ref: '#/components/schemas/RelyingParty'
        fido2:
          $ref: '#/components/schemas/FidoMetaData'
    AuthenticatorType:
      type: string
      pattern: 'PROPRIETARY|FIDO2'
    AuthenticatorStatus:
      type: string
      pattern: 'PENDING_VERIFICATION|TENTATIVE'
      description: |
        * PENDING_VERIFICATION - Probabilistically found passkey, no IDV completed.
        * LIKELY_AVAILABLE - Probabilistically found passkey, IDV completed.
    FidoAuthenticatorData:
      type: object
      description: "Object containing details for the 3rd party FIDO Authenticator."
      properties:
        relyingParty:
          $ref: '#/components/schemas/RelyingParty'
        fidoUserName:
          $ref: '#/components/schemas/FidoUserName'
        fidoDisplayName:
          $ref: '#/components/schemas/FidoDisplayName'
        fidoUserId:
          $ref: '#/components/schemas/FidoUserId'
        credentialId:
          $ref: '#/components/schemas/CredentialId'
        isSpcEnabled:
          $ref: "#/components/schemas/IsSpcEnabled"
        publicKeyCredential:
          $ref: "#/components/schemas/PublicKeyCredential"
    FidoMetaData:
      type: object
      description: "Contains details related to FIDO2 authenticator."
      properties:
        userId:
          $ref: '#/components/schemas/FidoUserId'
        userName:
          $ref: '#/components/schemas/FidoUserName'
        displayName:
          $ref: '#/components/schemas/FidoDisplayName'
        isSpcEnabled:
          type: boolean
          description: "Indicates whether the device/browser supports W3C Secure Payment Confirmation (SPC)"
          default: false
          example: false
    FidoUserName:
      type: "string"
      description: "User Name as associated with the FIDO2 credentials"
      minLength: 1
      maxLength: 64
      example: "John Smith"
    FidoDisplayName:
      type: "string"
      description: "Display Name as associated with the FIDO2 credentials"
      minLength: 1
      maxLength: 64
      example: "John Smith"
    CredentialId:
      type: "string"
      description: "User Id as associated with the FIDO2 credentials"
      minLength: 1
      maxLength: 2048
      example: "hW_tcmtOzDiDvZ0zYOBWON0ZOAULdHTnXJ7tLXle1-U"
    MfaMethodType:
      type: "string"
      description: "Type of the MFA method."
      example: "PROPRIETARY|FIDO2"
    ServiceId:
      type: "string"
      description: "A unique identifier assigned by Mastercard for which tokens are created uniquely for the entity onboarded."
      pattern: "^[0-9a-zA-Z#_-]*$"
      example: "SECURE_COF_COMMERCE_PLATFORM#SAMPLE_MERCHANT#01"
    SrcClientId:
      type: "string"
      description: "A unique identifier assigned by Mastercard during onboarding which signifies the responsible party Integrating to Mastercard Checkout Solutions (MCS)."
      pattern: "[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}"
      format: UUID
      example: "eccbf087-f159-4d69-b31d-00bec75c0474"
    SrcCorrelationId:
      type: "string"
      description: "A unique identifier that correlates a series of two or more requests to a single session of activity. Mastercard Checkout Solutions (MCS) will return a new srcCorrelationId in each response by default, but Integrators may choose to populate previously used srcCorrelationIds in subsequent requests to correlate their activity under a single ID. This can be done by providing a Mastercard generated srcCorrelationId in the request, or by generating your own ID in the same format. SrcCorrelationId is used for tracking and troubleshooting purposes within Mastercard's ecosystem."
      pattern: "^([0-9a-f]{8}.)?[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$"
      example: "43d4c8e5-b57e-4794-ac9b-6a454c9325cb"
    SrcDigitalCardId:
      type: "string"
      description: "A unique identifier that represents the token associated with a card enrolled into Mastercard Checkout Solutions (MCS). Use this srcDigitalCardId in subsequent checkout requests to retrieve a DSRP payload containing the associated token and cryptogram for payment authorization. Alternatively, use the srcDigitalCardId in a get card request to retrieve the maskedCard details."
      example: "51a977f3-bda4-498b-901d-b48ad4d97abv"
    SrciTransactionId:
      type: "string"
      description: "An optional UUID generated by the Integrator that may be passed for internal tracking purposes."
      maxLength: 255
      example: "18df482e-31f2-4289-b0d7-4d768b72d3ed"
    UriData:
      type: "object"
      description: "URI details to continue authentication by invoking the Authentication UI."
      properties:
        uri:
          type: "string"
          description: "URI to invoke Authentication UI."
          maxLength: 2048
          example: "https://sandbox.src.mastercard.com/auth"
        uriType:
          $ref: '#/components/schemas/UriType'
    UriType:
      type: string
      description: Type of URI provided to continue authentication with. Conditional - Returned when URI is available.
      pattern: 'APP_URI|WEB_URI'
      example: "WEB_URI"
    VerificationData:
      type: "object"
      required:
        - "verificationType"
        - "verificationEntity"
        - "verificationMethod"
        - "verificationResults"
        - "verificationTimestamp"
        - "verificationEvents"
        - "additionalData"
      properties:
        verificationType:
          type: "string"
          description: "Type of consumer verification. This attribute's value should match those received in authenticate() method's response after completing the challenge."
          example: "CARDHOLDER"
        verificationEntity:
          type: "string"
          description: |
            Entity performing verification. This attribute's value should match those received in authenticate() method's response after completing the challenge.
            
            Valid values:
            
            * 01 Integrator
            * 03 Issuer
          example: "03"
        verificationMethod:
          type: "string"
          description: |
            Card Issuer verification of the cardholder. This attribute's value should match those received in authenticate() method's response after completing the challenge.
            
            Valid values:
            * 02 App Authentication
            * 04 A shared secret between the Card Issuer and the Cardholder such as One Time Passcode (OTP), activation code.
            * 06 Proprietary method of authentication.
            * 07 FIDO2 authentication
            * 26 Issuer Risk-Based Authentication
          maxLength: 64
          example: "01"
        verificationResults:
          type: "string"
          description: |
            Indicates whether the cardholder was verified or not, and what the results are when verified. This attribute's value should match those received in authenticate() method's response after completing the challenge.
            
            Valid values:
            
            * 01 Verified
            * 02 Not Verified
            * 04 Authenticator Registered
          maxLength: 64
          example: "02"
        verificationTimestamp:
          type: "string"
          description: "UTC time in UNIX epoch format."
          example: "1678294563"
        verificationEvents:
          type: "array"
          description: |
            Indicates the event where verification occurred. This attribute's value should match those received in authenticate() method's response after completing the challenge.
            
            Valid values:
            
            * 01 - TRANSACTION_AUTHENTICATION
            * 02 - ENROLL_FINANCIAL_INSTRUMENT
            * 04 - CONSUMER_IDENTITY_VALIDATION
            * 64 - AUTHENTICATOR_REGISTRATION
          example: "04"
          items:
            type: "string"
        additionalData:
          type: "string"
          description: |
            "Additional information associated to the verification input for the network to process. 
            Could vary depending on the use case. May carry a JWT token as a proof of authentication performed by the authenticating entity."
          format: "byte"
          example: ""
    AuthenticateVerificationData:
      type: "object"
      required:
        - "verificationType"
        - "verificationEntity"
        - "verificationMethod"
        - "verificationResults"
        - "verificationTimestamp"
        - "verificationEvents"
        - "additionalData"
      properties:
        verificationType:
          type: "string"
          description: "Type of consumer verification."
          example: "CARDHOLDER"
        verificationEntity:
          type: "string"
          description: |
            Entity performing verification.
            
            Valid values:
            
            * 01 Integrator
            * 03 Issuer
          example: "03"
        verificationMethod:
          type: "string"
          description: |
            Card Issuer verification of the cardholder.
            
            Valid values:
            * 02 App Authentication
            * 04 A shared secret between the Card Issuer and the Cardholder such as One Time Passcode (OTP), activation code.
            * 06 Proprietary method of authentication.
            * 07 FIDO2 Authentication
          maxLength: 64
          example: "01"
        verificationResults:
          type: "string"
          description: |
            Indicates whether the cardholder was verified or not, and what the results are when verified.
            
            Valid values:
            
            * 01 Verified
            * 02 Not Verified
            * 03 Not Performed
          maxLength: 64
          example: "02"
        verificationTimestamp:
          type: "string"
          description: "UTC time in UNIX epoch format."
          example: "1678294563"
        verificationEvents:
          type: "array"
          description: |
            Indicates the event where verification occurred.
            
            Valid values:
            
            * 01 - TRANSACTION_AUTHENTICATION
            * 02 - ENROLL_FINANCIAL_INSTRUMENT
            * 04 - CONSUMER_IDENTITY_VALIDATION
            * 64 - AUTHENTICATOR_REGISTRATION
          example: "04"
          items:
            type: "string"
        additionalData:
          type: "string"
          description: "Additional assurance data, like a JWT token with additional data claims."
          format: "byte"
          example: ""
    SrcDpaId:
      type: "string"
      description: "The registered identifier for the Digital Payment Application (DPA) accessing the service."
      example: "b7a4316a-fefa-4452-9ac8-376d3152ecad"
  examples:
    BadRequestExample:
      value:
        status: 400
        reason: INVALID_ARGUMENT
        message: Client specified an invalid argument. Check error message and error details for more information.
        errordetail:
          - reason: INVALID_ARGUMENT
            message: Client specified an invalid argument. Check error message and error details for more information.
            sourceType: BODY
            source: string
    BadRequest3PFIDOSPK:
      value:
        status: 400
        reason: "INVALID_STATE"
        message: "Cannot process the request because it is malformed or has incorrect/missing fields or values."
        errordetail:
          - reason: "AUTHENTICATION_FAILED"
            message: "Failed authentication."
            sourceType: "BODY"
            source: "authenticationMethod.boundMfaMethod.mfaMethod.assertionData"
    BadRequestExampleSTFExpiredTxAV:
      value:
        status: 400
        reason: "INVALID_ARGUMENT"
        message: "Cannot process the request because it is malformed or has incorrect/missing fields or values."
        errordetail: [
          {
            "reason": "INVALID_VALUE",
            "message": "Expired proof of authentication(IAAV) was provided. Binding can be re-tried with valid verification data.",
            "sourceType": "BODY",
            "source": "authenticationMethod.authenticationCredential"
          }
        ]
    BadRequestExample3PPKI:
      value:
        status: 400
        reason: "INVALID_STATE"
        message: "Cannot process the request because it is malformed or has incorrect/missing fields or values."
        errordetail: [
          {
            "reason": "AUTHENTICATOR_INSTANCE_NOT_BOUND",
            "message": "No existing binding found for the provided card and FIDO authenticator. Please try again with a valid card-authenticator combination.",
            "sourceType": "BODY",
            "source": "srcDigitalCardId"
          }
        ]
    BadRequestPushNotificationMissingResendCompleted:
      value:
        status: 400
        "reason": "INVALID_ARGUMENT"
        "message": "Cannot process the request because it is malformed or has incorrect/missing fields or values."
        errordetail: [
          {
            "reason": "INVALID_VALUE",
            "message": "Cannot process the request because it is malformed or has incorrect/missing fields or values.",
            "sourceType": "BODY",
            "source": "authenticationMethod.methodAttributes.pushNotification.resend, authenticationMethod.methodAttributes.pushNotification.completed"
          }
        ]
    BadRequestPushNotificationInvalidateResend:
      value:
        status: 400
        "reason": "INVALID_ARGUMENT"
        "message": "Cannot process the request because it is malformed or has incorrect/missing fields or values."
        errordetail: [
          {
            "reason": "INVALID_VALUE",
            "message": "Cannot process the request because it is malformed or has incorrect/missing fields or values.",
            "sourceType": "BODY",
            "source": "authenticationMethod.methodAttributes.pushNotification.resend"
          }
        ]
    BadRequestExampleSTFTxAV:
      value:
        status: 400
        reason: "INVALID_STATE"
        message: "Cannot process the request because it is malformed or has incorrect/missing fields or values."
        errordetail: [
          { "reason": "AUTHENTICATION_FAILED",
            "message": "Invalid proof of authentication supplied. Please try again with a valid Proof of Authentication.",
            "sourceType": "BODY",
            "source": "authenticationMethod.authenticationCredential" }
        ]
    BadRequestExampleIAO:
